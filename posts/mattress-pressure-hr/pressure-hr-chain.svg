<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 656" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">床垫压力心率算法架构：通用模块抽象</title>
  <desc id="desc">数字压力波形经去基线、带通滤波、幅度归一化和迟滞整形后，生成多路候选心搏间隔。各路分别进行稳健统计，抑制异常间隔并评估稳定性，再按质量择优换算心率，附带质量指标与有效性标记。A 到 N 表示抽象分支，不给出具体估计器构造、实际数量或参数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="656" rx="12" fill="#FFFFFF"/>
  <g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="20" y="28" font-size="16" font-weight="600" fill="#0F172A">心率算法架构</text>
    <text x="660" y="28" font-size="12" text-anchor="end" fill="#64748B">通用模块抽象</text>

    <rect x="200" y="44" width="280" height="38" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="340" y="69" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">压力波形 · ADC 采样输入</text>
    <path d="M200 63 H120 V106" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="20" y="108" width="200" height="62" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="120" y="133" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">去基线</text>
    <text x="120" y="154" text-anchor="middle" font-size="12" fill="#1D4ED8">扣除缓慢变化的趋势</text>
    <path d="M222 139 H236" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="240" y="108" width="200" height="62" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="340" y="133" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">带通滤波</text>
    <text x="340" y="154" text-anchor="middle" font-size="12" fill="#1D4ED8">保留目标频段的波动</text>
    <path d="M442 139 H456" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="460" y="108" width="200" height="62" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="560" y="133" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">幅度归一化</text>
    <text x="560" y="154" text-anchor="middle" font-size="12" fill="#1D4ED8">统一不同强度的幅度尺度</text>
    <path d="M560 170 V188" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="20" y="192" width="640" height="60" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="340" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">迟滞整形与节拍提取</text>
    <text x="340" y="238" text-anchor="middle" font-size="12" fill="#1D4ED8">把连续波形转为节拍事件，抑制小幅抖动引起的重复触发</text>

    <path d="M340 252 V270 H160 V286" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M340 270 H520 V286" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="20" y="290" width="280" height="56" rx="9" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="160" y="313" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">间隔估计 A</text>
    <text x="160" y="334" text-anchor="middle" font-size="12" fill="#6D28D9">生成候选心搏间隔序列</text>
    <text x="340" y="322" text-anchor="middle" font-size="21" fill="#8B5CF6">···</text>
    <rect x="380" y="290" width="280" height="56" rx="9" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="520" y="313" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">间隔估计 N</text>
    <text x="520" y="334" text-anchor="middle" font-size="12" fill="#6D28D9">生成候选心搏间隔序列</text>

    <path d="M160 346 V366" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M520 346 V366" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="20" y="370" width="280" height="62" rx="9" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="160" y="395" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">稳健统计</text>
    <text x="160" y="416" text-anchor="middle" font-size="12" fill="#6D28D9">抑制异常间隔 · 评估间隔稳定性</text>
    <text x="340" y="405" text-anchor="middle" font-size="21" fill="#8B5CF6">···</text>
    <rect x="380" y="370" width="280" height="62" rx="9" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="520" y="395" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">稳健统计</text>
    <text x="520" y="416" text-anchor="middle" font-size="12" fill="#6D28D9">抑制异常间隔 · 评估间隔稳定性</text>

    <path d="M160 432 V448 H520 V432" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M340 448 V466" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="20" y="470" width="640" height="62" rx="9" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="340" y="495" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">质量比较与结果选择</text>
    <text x="340" y="516" text-anchor="middle" font-size="12" fill="#047857">比较各路间隔稳定性，选择候选结果并标记质量</text>
    <path d="M340 532 V550" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="20" y="554" width="640" height="52" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="40" y="586" font-size="15" font-weight="600" fill="#0F172A">心搏间隔 → 逐拍心率</text>
    <text x="640" y="585" text-anchor="end" font-size="13" fill="#475569">质量指标 · 有效性标记</text>
    <path d="M20 624 H660" fill="none" stroke="#E2E8F0"/>
    <text x="340" y="645" text-anchor="middle" font-size="12" fill="#475569">CH58X 端侧实现：流式 C 处理 · 统计量增量更新 · 固定大小缓冲区</text>
  </g>
</svg>
