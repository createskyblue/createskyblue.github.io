<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- dispatch -->
  <rect x="30" y="80" width="220" height="110" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="140" y="108" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">lwevt_dispatch_ex()</text>
  <text x="140" y="132" font-size="11" fill="#334155" text-anchor="middle">evt-&gt;type = type</text>
  <text x="140" y="152" font-size="11" fill="#334155" text-anchor="middle">for (idx &lt; evt_fncs_cnt)</text>
  <text x="140" y="172" font-size="11" fill="#334155" text-anchor="middle">evt_fncs[idx](evt)</text>

  <!-- listener table -->
  <rect x="300" y="50" width="190" height="170" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="395" y="74" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">监听表 evt_fncs[8]</text>
  <rect x="315" y="88" width="160" height="28" rx="4" fill="#ffffff" stroke="#10b981"/>
  <text x="325" y="107" font-size="11" fill="#0f172a">[0] on_event</text>
  <rect x="315" y="122" width="160" height="28" rx="4" fill="#ffffff" stroke="#10b981"/>
  <text x="325" y="141" font-size="11" fill="#0f172a">[1] on_temp_log</text>
  <rect x="315" y="156" width="160" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="325" y="175" font-size="11" fill="#64748b">[2] 空闲</text>
  <text x="395" y="206" font-size="10" fill="#475569" text-anchor="middle">注册去重，只追加不删除</text>

  <!-- listeners -->
  <rect x="560" y="50" width="210" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="665" y="76" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">on_event(evt)</text>
  <text x="665" y="98" font-size="11" fill="#334155" text-anchor="middle">switch (evt-&gt;type)</text>
  <rect x="560" y="130" width="210" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="665" y="156" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">on_temp_log(evt)</text>
  <text x="665" y="178" font-size="11" fill="#334155" text-anchor="middle">if (evt-&gt;type == ...)</text>

  <!-- arrows -->
  <line x1="250" y1="135" x2="300" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="100" x2="560" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="160" x2="560" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="140" y="220" font-size="11" fill="#475569" text-anchor="middle">所有监听器收到所有事件</text>
  <text x="665" y="226" font-size="11" fill="#475569" text-anchor="middle">过滤由监听器自己判断</text>

  <!-- note -->
  <rect x="120" y="255" width="560" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="277" font-size="11" fill="#334155" text-anchor="middle">数据零拷贝：事件数据就在句柄 union 里，监听器直接读写</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
