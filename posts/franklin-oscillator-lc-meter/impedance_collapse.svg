<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="720" height="320" fill="#f8fafc"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#0f172a">复阻抗塌缩为标量频率：少一个信息维度</text>
  <rect x="20" y="50" width="300" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="82" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">VNA 阻抗分析</text>
  <text x="170" y="104" font-size="12" fill="#64748b" text-anchor="middle">输出复阻抗矢量</text>
  <g transform="translate(90,148)">
    <line x1="0" y1="60" x2="120" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="20" y1="92" x2="20" y2="8" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="112" y="74" font-size="11" fill="#64748b">R</text>
    <text x="4" y="14" font-size="11" fill="#64748b">X</text>
    <line x1="20" y1="60" x2="95" y2="22" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="95" cy="22" r="4" fill="#2563eb"/>
    <text x="52" y="38" font-size="11" fill="#1d4ed8">Z</text>
  </g>
  <text x="170" y="244" font-size="13" fill="#334155" text-anchor="middle">Z = R + jX</text>
  <text x="170" y="266" font-size="12" fill="#475569" text-anchor="middle">幅值 + 相位 · ESR / Q / D 均可解</text>
  <line x1="330" y1="170" x2="392" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="392,170 384,165 384,175" fill="#94a3b8"/>
  <text x="361" y="160" font-size="11" fill="#64748b" text-anchor="middle">信息塌缩</text>
  <rect x="400" y="50" width="300" height="240" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="82" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">本振荡器</text>
  <text x="550" y="104" font-size="12" fill="#92400e" text-anchor="middle">输出单一标量</text>
  <text x="550" y="172" font-size="56" font-weight="800" fill="#b45309" text-anchor="middle">f</text>
  <text x="550" y="244" font-size="13" fill="#334155" text-anchor="middle">实部 / 虚部压成一个频率</text>
  <text x="550" y="266" font-size="12" fill="#475569" text-anchor="middle">测不到 R · ESR · Q · 相位</text>
</svg>
