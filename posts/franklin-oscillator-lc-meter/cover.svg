<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- 左侧：被鄙视的 AVR / Arduino（放大，占更多画面） -->
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="46" fill="#64748b">电子圈都笑它</text>
  <text x="55" y="350" font-family="Arial, sans-serif" font-size="200" font-weight="800" fill="#94a3b8">AVR</text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#64748b">「玩具」单片机</text>

  <!-- 中间粗箭头：反差 -->
  <line x1="450" y1="370" x2="620" y2="370" stroke="url(#accent)" stroke-width="11"/>
  <path d="M 620 370 l -30 -19 l 0 38 z" fill="#22d3ee"/>

  <!-- 右侧：它实际干成的活（粗体方波 + 大号 f = 频率计数） -->
  <path d="M 680 370 L 680 280 L 795 280 L 795 460 L 910 460 L 910 280 L 1025 280 L 1025 460 L 1110 460"
        stroke="url(#accent)" stroke-width="13" fill="none" stroke-linejoin="miter"/>
  <text x="1000" y="255" font-family="Georgia, serif" font-size="205" font-weight="700" fill="#22d3ee">f</text>
  <text x="700" y="560" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#e2e8f0">阻抗测量</text>

  <!-- 底部强调线 -->
  <rect x="0" y="660" width="1200" height="15" fill="#22d3ee"/>
</svg>
