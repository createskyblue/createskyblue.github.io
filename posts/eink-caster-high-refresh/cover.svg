<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="260" fill="#f8fafc"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">如何用 FPGA 实现墨水屏高刷</text>

  <!-- monitor -->
  <rect x="40" y="58" width="250" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="58" y="76" width="214" height="134" rx="6" fill="#e2e8f0"/>
  <!-- 3x3 pixels -->
  <g>
    <rect x="66" y="84" width="62" height="38" rx="4" fill="#cbd5e1"/>
    <rect x="134" y="84" width="62" height="38" rx="4" fill="#cbd5e1"/>
    <rect x="202" y="84" width="62" height="38" rx="4" fill="#cbd5e1"/>
    <rect x="66" y="128" width="62" height="38" rx="4" fill="#cbd5e1"/>
    <!-- highlighted pixel with timer -->
    <rect x="134" y="128" width="62" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="165" cy="142" r="9" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <line x1="165" y1="142" x2="165" y2="136" stroke="#d97706" stroke-width="2"/>
    <line x1="165" y1="142" x2="170" y2="144" stroke="#d97706" stroke-width="2"/>
    <text x="165" y="162" text-anchor="middle" font-size="9" fill="#92400e">计时</text>
    <rect x="202" y="128" width="62" height="38" rx="4" fill="#cbd5e1"/>
    <rect x="66" y="172" width="62" height="34" rx="4" fill="#cbd5e1"/>
    <rect x="134" y="172" width="62" height="34" rx="4" fill="#cbd5e1"/>
    <rect x="202" y="172" width="62" height="34" rx="4" fill="#cbd5e1"/>
  </g>
  <text x="165" y="246" text-anchor="middle" font-size="12" fill="#475569">墨水屏：每个像素独立计时</text>

  <!-- FPGA -->
  <rect x="400" y="86" width="200" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Caster FPGA</text>
  <text x="500" y="142" text-anchor="middle" font-size="11" fill="#1e40af">每像素状态机 + 早取消</text>
  <text x="500" y="160" text-anchor="middle" font-size="11" fill="#1e40af">视频直通 &lt;20µs</text>

  <!-- fan-out arrows -->
  <line x1="400" y1="110" x2="306" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="126" x2="306" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="142" x2="306" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#64748b">并行驱动，无全局排队</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563eb"/></marker>
  </defs>
</svg>
