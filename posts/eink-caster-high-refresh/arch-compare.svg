<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <rect width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">架构对比：全局时间线 vs 每像素时间线</text>
  <line x1="340" y1="48" x2="340" y2="380" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- LEFT: traditional -->
  <text x="175" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">传统 EPDC</text>
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="75" y="74" width="200" height="34" rx="6"/><rect x="75" y="124" width="200" height="34" rx="6"/>
    <rect x="75" y="174" width="200" height="34" rx="6"/><rect x="75" y="224" width="200" height="34" rx="6"/>
    <rect x="75" y="284" width="200" height="44" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="175" y="95">视频输入</text>
    <text x="175" y="145">全局计数器（1 个）</text>
    <text x="175" y="195">波形 LUT 查表</text>
    <text x="175" y="245">整屏共用一条时间线</text>
  </g>
  <text x="175" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">排队 ~100ms</text>
  <text x="175" y="322" text-anchor="middle" font-size="11" fill="#dc2626">图像率被钉在 ~10Hz</text>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="175" y1="108" x2="175" y2="124"/><line x1="175" y1="158" x2="175" y2="174"/>
    <line x1="175" y1="208" x2="175" y2="224"/><line x1="175" y1="258" x2="175" y2="284"/>
  </g>
  <!-- pixel row greyed -->
  <g fill="#e2e8f0" stroke="#cbd5e1">
    <rect x="80" y="346" width="22" height="22" rx="3"/><rect x="106" y="346" width="22" height="22" rx="3"/>
    <rect x="132" y="346" width="22" height="22" rx="3"/><rect x="158" y="346" width="22" height="22" rx="3"/>
    <rect x="184" y="346" width="22" height="22" rx="3"/><rect x="210" y="346" width="22" height="22" rx="3"/>
    <rect x="236" y="346" width="22" height="22" rx="3"/>
  </g>
  <text x="175" y="388" text-anchor="middle" font-size="11" fill="#64748b">所有像素同步推进，新画面需等整屏走完</text>

  <!-- RIGHT: Caster -->
  <text x="505" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Caster（FPGA）</text>
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="405" y="74" width="200" height="34" rx="6"/><rect x="405" y="124" width="200" height="34" rx="6"/>
    <rect x="405" y="284" width="200" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="505" y="95">视频输入（DVI/DP）</text>
    <text x="505" y="145">FPGA 控制器</text>
  </g>
  <text x="505" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">无排队 · 直通 &lt;20µs</text>
  <text x="505" y="322" text-anchor="middle" font-size="11" fill="#16a34a">各像素独立进度</text>
  <!-- per-pixel counter boxes -->
  <g fill="#eff6ff" stroke="#2563eb" stroke-width="1.5">
    <rect x="405" y="178" width="60" height="30" rx="5"/><rect x="475" y="178" width="60" height="30" rx="5"/>
    <rect x="545" y="178" width="60" height="30" rx="5"/>
  </g>
  <g font-size="11" fill="#1d4ed8" text-anchor="middle">
    <text x="435" y="197">Px₁</text><text x="505" y="197">Px₂</text><text x="575" y="197">Pxₙ</text>
  </g>
  <text x="505" y="221" text-anchor="middle" font-size="10" fill="#64748b">… 每像素一个独立计时器 …</text>
  <!-- fan-out arrows -->
  <g stroke="#2563eb" stroke-width="1.5" fill="#2563eb">
    <line x1="460" y1="158" x2="435" y2="178" marker-end="url(#b)"/>
    <line x1="505" y1="158" x2="505" y2="178" marker-end="url(#b)"/>
    <line x1="550" y1="158" x2="575" y2="178" marker-end="url(#b)"/>
    <line x1="435" y1="208" x2="470" y2="284" marker-end="url(#b)"/>
    <line x1="505" y1="208" x2="505" y2="284" marker-end="url(#b)"/>
    <line x1="575" y1="208" x2="540" y2="284" marker-end="url(#b)"/>
  </g>
  <!-- pixel row colorful -->
  <g stroke="#cbd5e1">
    <rect x="410" y="346" width="22" height="22" rx="3" fill="#bfdbfe"/><rect x="436" y="346" width="22" height="22" rx="3" fill="#fde68a"/>
    <rect x="462" y="346" width="22" height="22" rx="3" fill="#bbf7d0"/><rect x="488" y="346" width="22" height="22" rx="3" fill="#fecaca"/>
    <rect x="514" y="346" width="22" height="22" rx="3" fill="#bfdbfe"/><rect x="540" y="346" width="22" height="22" rx="3" fill="#fde68a"/>
    <rect x="566" y="346" width="22" height="22" rx="3" fill="#bbf7d0"/>
  </g>
  <text x="505" y="388" text-anchor="middle" font-size="11" fill="#64748b">各像素按自己进度推进，新画面即时受理</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563eb"/></marker>
  </defs>
</svg>
