<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <rect width="680" height="300" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">早取消：驱动到一半反悔，按已走比例算返程</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">粒子只走了 1/3 路程，推回去也只需 1/3 时间，不必先走完全程</text>

  <!-- axis -->
  <line x1="100" y1="240" x2="630" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="100" font-size="12" fill="#334155">白</text>
  <text x="60" y="245" font-size="12" fill="#334155">黑</text>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="100" y="258">0</text><text x="190" y="258">3</text><text x="280" y="258">6</text><text x="370" y="258">9</text>
    <text x="460" y="258">…</text><text x="630" y="258">帧</text>
  </g>

  <!-- faint reference: if continued to black -->
  <path d="M190 170 L370 240" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text x="300" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">若坚持走完：9 帧才到黑</text>

  <!-- driven path white -> toward black, flips at frame 3 -->
  <path d="M100 95 L190 170" stroke="#2563eb" stroke-width="3" fill="none"/>
  <circle cx="100" cy="95" r="5" fill="#2563eb"/>
  <text x="120" y="120" font-size="11" fill="#2563eb">驱动中：已走 3 帧</text>

  <!-- flip marker -->
  <line x1="190" y1="170" x2="190" y2="95" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="190" cy="170" r="6" fill="#d97706"/>
  <text x="200" y="160" font-size="11" fill="#d97706" font-weight="700">目标翻转 ↻</text>

  <!-- early cancel return: back to white in 7 frames -->
  <path d="M190 170 L370 95" stroke="#16a34a" stroke-width="3" fill="none"/>
  <text x="280" y="140" font-size="11" fill="#16a34a" font-weight="700">返程只需 7 帧</text>
  <text x="280" y="156" font-size="10" fill="#16a34a">(csr_b2wframe − pixel_framecnt + 1)</text>
  <circle cx="370" cy="95" r="5" fill="#16a34a"/>
  <text x="430" y="100" font-size="11" fill="#16a34a">回到白，未浪费全程</text>
</svg>
