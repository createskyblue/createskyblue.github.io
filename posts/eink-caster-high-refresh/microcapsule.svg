<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <rect width="680" height="360" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">微胶囊：电场驱动双色带电颗粒</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">同一胶囊内黑、白颗粒共浴于透明油中，电压方向决定谁浮向观察者</text>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="#475569">↑ 观察者面</text>

  <!-- Capsule A: white state -->
  <text x="170" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">+V 时显示白</text>
  <rect x="110" y="112" width="120" height="10" rx="3" fill="#94a3b8"/>
  <text x="246" y="121" font-size="12" fill="#2563eb">+V</text>
  <ellipse cx="170" cy="200" rx="70" ry="80" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="150" cy="160" r="9" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="180" cy="150" r="9" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="165" cy="178" r="9" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="155" cy="240" r="9" fill="#111827"/>
  <circle cx="185" cy="248" r="9" fill="#111827"/>
  <circle cx="170" cy="225" r="9" fill="#111827"/>
  <rect x="110" y="288" width="120" height="10" rx="3" fill="#94a3b8"/>
  <text x="246" y="297" font-size="12" fill="#111827">-V</text>
  <path d="M205 165 L232 150" stroke="#2563eb" stroke-width="2" marker-end="url(#up)"/>
  <path d="M205 245 L232 260" stroke="#111827" stroke-width="2" marker-end="url(#dn)"/>

  <!-- Capsule B: black state -->
  <text x="510" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">-V 时显示黑</text>
  <rect x="450" y="112" width="120" height="10" rx="3" fill="#94a3b8"/>
  <text x="434" y="121" text-anchor="end" font-size="12" fill="#2563eb">+V</text>
  <ellipse cx="510" cy="200" rx="70" ry="80" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="490" cy="160" r="9" fill="#111827"/>
  <circle cx="520" cy="150" r="9" fill="#111827"/>
  <circle cx="505" cy="178" r="9" fill="#111827"/>
  <circle cx="495" cy="240" r="9" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="525" cy="248" r="9" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="510" cy="225" r="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="450" y="288" width="120" height="10" rx="3" fill="#94a3b8"/>
  <text x="434" y="297" text-anchor="end" font-size="12" fill="#111827">-V</text>
  <path d="M545 165 L572 150" stroke="#2563eb" stroke-width="2" marker-end="url(#up)"/>
  <path d="M545 245 L572 260" stroke="#111827" stroke-width="2" marker-end="url(#dn)"/>

  <!-- TFT substrate -->
  <rect x="90" y="320" width="500" height="22" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="340" y="335" text-anchor="middle" font-size="12" fill="#475569">TFT 基板：行/列扫描线施加电场（寻址方式与 LCD 同源）</text>

  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker>
  </defs>
</svg>
