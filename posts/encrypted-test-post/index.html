  <script>
  (function() {
    var encoder = new TextEncoder();
    var decoder = new TextDecoder();

    function base64ToBytes(value) {
      var binary = atob(value);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function joinBytes(left, right) {
      var joined = new Uint8Array(left.length + right.length);
      joined.set(left, 0);
      joined.set(right, left.length);
      return joined;
    }

    async function deriveAesKey(secret, salt, iterations) {
      var keyMaterial = await crypto.subtle.importKey(
        'raw', encoder.encode(secret), 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function decrypt(payload, secret) {
      if (!payload || !payload.encrypted) throw new Error('Payload is not encrypted');
      var salt = base64ToBytes(payload.salt);
      var iv = base64ToBytes(payload.iv);
      var ciphertext = base64ToBytes(payload.ciphertext);
      var tag = base64ToBytes(payload.tag);
      var key = await deriveAesKey(secret, salt, payload.iterations);
      var plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        joinBytes(ciphertext, tag)
      );
      return JSON.parse(decoder.decode(plaintext));
    }

    var encryptedDataEl = document.getElementById('encrypted-data');
    if (!encryptedDataEl) return;

    var payload = JSON.parse(encryptedDataEl.textContent);
    var form = document.getElementById('decrypt-form');
    var input = document.getElementById('decrypt-key');
    var errorEl = document.getElementById('decrypt-error');
    var decryptUi = document.querySelector('.decrypt-ui');
    var contentEl = document.getElementById('decrypted-content');

    form.addEventListener('submit', async function() {
      var key = input.value.trim();
      if (!key) { errorEl.textContent = '请输入密钥。'; return; }
      errorEl.textContent = '';
      try {
        var result = await decrypt(payload, key);
        contentEl.innerHTML = result.content || '';
        decryptUi.style.display = 'none';
        contentEl.style.display = '';
      } catch (e) {
        errorEl.textContent = '解密失败，请检查密钥。';
      }
    });
  })();
  </script>
