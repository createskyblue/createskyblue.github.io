<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="800" y="64" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="42" font-weight="700" fill="#172033">双霍尔传感器的位置判断</text>
  <text x="800" y="105" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" fill="#475569">两个电平组合对应不同的位置区间</text>

  <!-- Combined state regions along the magnet path. -->
  <path d="M427.6 435 A430 430 0 0 1 585 277.6" fill="none" stroke="#e7ecef" stroke-width="92" stroke-linecap="butt"/>
  <path d="M585 277.6 A430 430 0 0 1 725.3 226.5" fill="none" stroke="#a7d8a9" stroke-width="92" stroke-linecap="butt"/>
  <path d="M725.3 226.5 A430 430 0 0 1 874.7 226.5" fill="none" stroke="#80cbc4" stroke-width="92" stroke-linecap="butt"/>
  <path d="M874.7 226.5 A430 430 0 0 1 1015 277.6" fill="none" stroke="#f7c873" stroke-width="92" stroke-linecap="butt"/>
  <path d="M1015 277.6 A430 430 0 0 1 1172.4 435" fill="none" stroke="#e7ecef" stroke-width="92" stroke-linecap="butt"/>

  <!-- Region boundaries. -->
  <g stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.75">
    <line x1="800" y1="650" x2="585" y2="277.6"/>
    <line x1="800" y1="650" x2="725.3" y2="226.5"/>
    <line x1="800" y1="650" x2="874.7" y2="226.5"/>
    <line x1="800" y1="650" x2="1015" y2="277.6"/>
  </g>

  <!-- Wheel. -->
  <circle cx="800" cy="650" r="300" fill="#f8fafc" stroke="#334155" stroke-width="6"/>
  <circle cx="800" cy="650" r="8" fill="#334155"/>
  <path d="M1018 805 A270 270 0 0 1 910 895" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1088" y="850" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="28" fill="#334155">旋转方向</text>

  <!-- Hall sensor A. -->
  <g>
    <rect x="600" y="132" width="104" height="62" rx="8" fill="#2e7d32"/>
    <rect x="618" y="194" width="12" height="28" fill="#2e7d32"/>
    <rect x="646" y="194" width="12" height="28" fill="#2e7d32"/>
    <rect x="674" y="194" width="12" height="28" fill="#2e7d32"/>
    <line x1="652" y1="222" x2="652" y2="315" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="520" y="174" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="29" font-weight="700" fill="#1b5e20">霍尔 A</text>
  </g>

  <!-- Hall sensor B. -->
  <g>
    <rect x="896" y="132" width="104" height="62" rx="8" fill="#c47b16"/>
    <rect x="914" y="194" width="12" height="28" fill="#c47b16"/>
    <rect x="942" y="194" width="12" height="28" fill="#c47b16"/>
    <rect x="970" y="194" width="12" height="28" fill="#c47b16"/>
    <line x1="948" y1="222" x2="948" y2="315" stroke="#c47b16" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="1080" y="174" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="29" font-weight="700" fill="#99580b">霍尔 B</text>
  </g>

  <!-- State labels on the path. -->
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="middle" fill="#172033">
    <text x="462" y="386" font-size="25" font-weight="700">A/B = 1/1</text>
    <text x="640" y="284" font-size="27" font-weight="700">0/1</text>
    <text x="800" y="235" font-size="27" font-weight="700">0/0</text>
    <text x="960" y="284" font-size="27" font-weight="700">1/0</text>
    <text x="1138" y="386" font-size="25" font-weight="700">A/B = 1/1</text>
  </g>

  <!-- Magnet at A's switching boundary. -->
  <circle cx="650" cy="390" r="21" fill="#e53935" stroke="#9f1515" stroke-width="5"/>
  <line x1="632" y1="408" x2="485" y2="720" stroke="#e53935" stroke-width="4"/>
  <rect x="72" y="714" width="520" height="160" rx="12" fill="#fff7ed" stroke="#f6b86a" stroke-width="4"/>
  <circle cx="115" cy="764" r="13" fill="#e53935"/>
  <text x="148" y="774" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="29" font-weight="700" fill="#7c2d12">磁铁位于 A 的切换边界</text>
  <text x="114" y="828" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="26" fill="#7c2d12">A 可能变化，B 仍保持稳定</text>

  <!-- Combination legend. -->
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="middle">
    <rect x="180" y="955" width="280" height="92" rx="10" fill="#e7ecef" stroke="#aab4ba" stroke-width="2"/>
    <text x="320" y="994" font-size="25" font-weight="700" fill="#172033">A/B = 1/1</text>
    <text x="320" y="1027" font-size="21" fill="#475569">远离两只霍尔</text>

    <rect x="500" y="955" width="280" height="92" rx="10" fill="#a7d8a9" stroke="#6ea874" stroke-width="2"/>
    <text x="640" y="994" font-size="25" font-weight="700" fill="#172033">A/B = 0/1</text>
    <text x="640" y="1027" font-size="21" fill="#315a35">靠近霍尔 A</text>

    <rect x="820" y="955" width="280" height="92" rx="10" fill="#80cbc4" stroke="#4e9d96" stroke-width="2"/>
    <text x="960" y="994" font-size="25" font-weight="700" fill="#172033">A/B = 0/0</text>
    <text x="960" y="1027" font-size="21" fill="#275e59">两路激活区重叠</text>

    <rect x="1140" y="955" width="280" height="92" rx="10" fill="#f7c873" stroke="#c68d37" stroke-width="2"/>
    <text x="1280" y="994" font-size="25" font-weight="700" fill="#172033">A/B = 1/0</text>
    <text x="1280" y="1027" font-size="21" fill="#6f4a15">靠近霍尔 B</text>
  </g>
</svg>
