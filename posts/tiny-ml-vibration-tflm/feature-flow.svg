<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Consolas, 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#888"/></marker>
  </defs>

  <!-- Input -->
  <rect x="220" y="12" width="280" height="44" rx="4" fill="#E3ECF6" stroke="#7FA3C7" stroke-width="1.2"/>
  <text x="360" y="40" text-anchor="middle" fill="#444" font-weight="bold" font-size="14">加速度传感器 6000 个采样点</text>

  <line x1="300" y1="56" x2="160" y2="86" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="420" y1="56" x2="560" y2="86" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- FFT branch -->
  <rect x="30" y="89" width="260" height="42" rx="4" fill="#F5F5F5" stroke="#CCC" stroke-width="1"/>
  <text x="160" y="107" text-anchor="middle" fill="#444" font-weight="bold">FFT（整条 6000 点）</text>
  <text x="160" y="123" text-anchor="middle" fill="#888" font-size="11">np.fft.rfft → log1p(幅度) → 跳过 DC，取 64 bins</text>

  <line x1="160" y1="131" x2="160" y2="157" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="70" y="160" width="180" height="32" rx="4" fill="#E1ECDA" stroke="#89B37A" stroke-width="1"/>
  <text x="160" y="181" text-anchor="middle" fill="#3D5A2E" font-weight="bold">64 维频域特征</text>

  <!-- Time branch -->
  <rect x="430" y="86" width="260" height="52" rx="4" fill="#F5F5F5" stroke="#CCC" stroke-width="1"/>
  <text x="560" y="103" text-anchor="middle" fill="#444" font-weight="bold">时域分段（1500 点 × 4 段）</text>
  <text x="560" y="119" text-anchor="middle" fill="#888" font-size="11">均值 标准差 最大 最小 RMS 峰值</text>
  <text x="560" y="133" text-anchor="middle" fill="#888" font-size="11">过零率 能量 非零比</text>

  <line x1="560" y1="138" x2="560" y2="162" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="470" y="165" width="180" height="32" rx="4" fill="#E1ECDA" stroke="#89B37A" stroke-width="1"/>
  <text x="560" y="186" text-anchor="middle" fill="#3D5A2E" font-weight="bold">36 维时域特征</text>

  <!-- Merge -->
  <line x1="250" y1="176" x2="295" y2="218" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="470" y1="181" x2="425" y2="218" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="235" y="221" width="250" height="40" rx="4" fill="#E3ECF6" stroke="#7FA3C7" stroke-width="1.2"/>
  <text x="360" y="239" text-anchor="middle" fill="#333" font-weight="bold" font-size="14">合并：100 维特征向量</text>
  <text x="360" y="255" text-anchor="middle" fill="#667" font-size="11">64 维频域 + 36 维时域</text>

  <line x1="360" y1="261" x2="360" y2="295" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Scaler -->
  <rect x="235" y="298" width="250" height="30" rx="4" fill="#F5F5F5" stroke="#CCC" stroke-width="1"/>
  <text x="360" y="318" text-anchor="middle" fill="#666" font-size="12">StandardScaler 标准化 + int8 量化</text>

  <line x1="360" y1="328" x2="360" y2="358" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Model -->
  <rect x="200" y="361" width="320" height="50" rx="4" fill="#EDE2F0" stroke="#A681B5" stroke-width="1.2"/>
  <text x="360" y="379" text-anchor="middle" fill="#4A3060" font-weight="bold" font-size="14">TFLM 神经网络</text>
  <text x="360" y="399" text-anchor="middle" fill="#6B5080" font-size="11">Dense(100→16, ReLU) → Dense(16→8, ReLU) → Dense(8→3, Softmax)</text>

  <line x1="360" y1="411" x2="360" y2="437" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="180" y="440" width="100" height="38" rx="4" fill="#E3ECF6" stroke="#7FA3C7" stroke-width="1"/>
  <text x="230" y="464" text-anchor="middle" fill="#333" font-weight="bold">震动A</text>
  <rect x="310" y="440" width="100" height="38" rx="4" fill="#E3ECF6" stroke="#7FA3C7" stroke-width="1"/>
  <text x="360" y="464" text-anchor="middle" fill="#333" font-weight="bold">震动B</text>
  <rect x="440" y="440" width="100" height="38" rx="4" fill="#E3ECF6" stroke="#7FA3C7" stroke-width="1"/>
  <text x="490" y="464" text-anchor="middle" fill="#333" font-weight="bold">震动C</text>

  <text x="360" y="504" text-anchor="middle" fill="#AAA" font-size="11">1803 参数 | 5,024 B Flash | ~1,800 B RAM</text>
</svg>
