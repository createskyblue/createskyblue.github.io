<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;background:#f8fafc;border-radius:8px;">
  <text x="20" y="26" fill="#334155" font-size="13" font-weight="bold">固定间隔：窗口一到，一起冲</text>
  <line x1="80" y1="88" x2="680" y2="88" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="108" fill="#94a3b8" font-size="11">0</text>
  <text x="652" y="108" fill="#94a3b8" font-size="11">上限</text>
  <circle cx="650" cy="36" r="7" fill="#ef4444"/>
  <circle cx="650" cy="52" r="7" fill="#ef4444"/>
  <circle cx="650" cy="68" r="7" fill="#f97316"/>
  <circle cx="634" cy="52" r="7" fill="#f59e0b"/>
  <circle cx="666" cy="52" r="7" fill="#fb7185"/>
  <text x="430" y="56" fill="#b91c1c" font-size="12">五台同时到点</text>

  <text x="20" y="138" fill="#334155" font-size="13" font-weight="bold">0 到上限随机抽：峰值被打散</text>
  <line x1="80" y1="180" x2="680" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="200" fill="#94a3b8" font-size="11">0</text>
  <text x="652" y="200" fill="#94a3b8" font-size="11">上限</text>
  <circle cx="150" cy="156" r="7" fill="#22c55e"/>
  <circle cx="260" cy="156" r="7" fill="#14b8a6"/>
  <circle cx="390" cy="156" r="7" fill="#3b82f6"/>
  <circle cx="510" cy="156" r="7" fill="#6366f1"/>
  <circle cx="620" cy="156" r="7" fill="#8b5cf6"/>
  <text x="20" y="226" fill="#64748b" font-size="12">失败后上限翻倍封顶，成功后再收回去。问的是「现在有没有到期该发的」。</text>
</svg>