<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <rect width="720" height="240" fill="#fafafa" rx="6"/>
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#222">CBOR 初始字节（initial byte）结构</text>

  <!-- 一个字节的 8 个位 -->
  <g transform="translate(120,50)">
    <rect x="0"   y="0" width="60" height="40" fill="#f0c8ff" stroke="#a66cc9"/>
    <rect x="60"  y="0" width="36" height="40" fill="#ffe4b5" stroke="#d4a373"/>
    <rect x="96"  y="0" width="36" height="40" fill="#ffe4b5" stroke="#d4a373"/>
    <rect x="132" y="0" width="36" height="40" fill="#ffe4b5" stroke="#d4a373"/>
    <rect x="168" y="0" width="36" height="40" fill="#ffe4b5" stroke="#d4a373"/>
    <rect x="204" y="0" width="36" height="40" fill="#ffe4b5" stroke="#d4a373"/>
    <rect x="240" y="0" width="36" height="40" fill="#b5e0ff" stroke="#5a9fd4"/>
    <rect x="276" y="0" width="36" height="40" fill="#b5e0ff" stroke="#5a9fd4"/>
    <rect x="312" y="0" width="36" height="40" fill="#b5e0ff" stroke="#5a9fd4"/>
    <rect x="348" y="0" width="36" height="40" fill="#b5e0ff" stroke="#5a9fd4"/>
    <rect x="384" y="0" width="36" height="40" fill="#b5e0ff" stroke="#5a9fd4"/>

    <text x="30"  y="25" text-anchor="middle" font-weight="bold" fill="#333">7 6 5</text>
    <text x="78"  y="25" text-anchor="middle" fill="#333">4</text>
    <text x="114" y="25" text-anchor="middle" fill="#333">3</text>
    <text x="150" y="25" text-anchor="middle" fill="#333">2</text>
    <text x="186" y="25" text-anchor="middle" fill="#333">1</text>
    <text x="222" y="25" text-anchor="middle" fill="#333">0</text>
    <!-- 低 5 位被分成 5 格但整体是 additional info，这里用一个括弧表示 -->
    <line x1="240" y1="-4" x2="420" y2="-4" stroke="#444"/>
    <line x1="240" y1="-8" x2="240" y2="0" stroke="#444"/>
    <line x1="420" y1="-8" x2="420" y2="0" stroke="#444"/>
    <text x="330" y="-12" text-anchor="middle" font-size="12" fill="#444">additional info (5 bit)</text>
    <text x="30"  y="56" text-anchor="middle" font-size="12" fill="#444">major type</text>
  </g>

  <!-- major type 表 -->
  <g font-size="12" fill="#333">
    <text x="20" y="130" font-weight="bold">major type（高 3 位）决定数据大类：</text>
    <text x="40" y="150">0  uint    1  negint    2  byte string    3  text string</text>
    <text x="40" y="168">4  array   5  map       6  tag(未实现)    7  simple/float</text>
  </g>

  <!-- additional info 长度规则 -->
  <g font-size="12" fill="#333">
    <text x="20" y="200" font-weight="bold">additional info（低 5 位）决定参数长度：</text>
    <text x="40" y="218">0–23 直接作值   24 后跟 1 字节   25 后跟 2 字节(BE)   26 后跟 4 字节(BE)</text>
    <text x="40" y="234">microcbor 不处理 27（8 字节、64 位）、28–30（保留）、31（不定长）</text>
  </g>
</svg>
