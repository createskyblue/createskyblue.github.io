<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-label="线缆内寄生电容把 10 kHz 方波耦合进 ADC 通道 1">
  <rect x="0" y="0" width="680" height="220" fill="#f8fafc"/>
  <text x="24" y="28" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#111827">线缆内两导线寄生电容把 10 kHz 方波耦合进 ADC 通道 1</text>

  <!-- board -->
  <rect x="32" y="56" width="140" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="102" y="92" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#065f46">测试电路板</text>
  <text x="102" y="118" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#047857">10 kHz 方波</text>
  <text x="102" y="148" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#047857">ADC 通道 1（悬空）</text>

  <!-- cable region -->
  <rect x="190" y="48" width="300" height="136" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="340" y="72" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b7280">测试线缆（另一端悬空）</text>

  <!-- black wire -->
  <line x1="172" y1="100" x2="500" y2="100" stroke="#111827" stroke-width="2.5"/>
  <circle cx="172" cy="100" r="4" fill="#111827"/>
  <circle cx="500" cy="100" r="4" fill="#111827"/>
  <text x="520" y="104" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#111827">黑端子</text>
  <text x="300" y="94" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#374151">10 kHz 导线</text>

  <!-- red wire -->
  <line x1="172" y1="150" x2="500" y2="150" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="172" cy="150" r="4" fill="#dc2626"/>
  <circle cx="500" cy="150" r="4" fill="#dc2626"/>
  <text x="520" y="154" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c">红端子</text>
  <text x="300" y="172" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#991b1b">悬空通道 1 导线</text>

  <!-- parasitic caps between wires -->
  <g stroke="#7c3aed" stroke-width="1.2" fill="none">
    <path d="M270 100 V128"/><path d="M278 100 V128"/>
    <path d="M310 100 V128"/><path d="M318 100 V128"/>
    <path d="M350 100 V128"/><path d="M358 100 V128"/>
  </g>
  <text x="314" y="124" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6d28d9">寄生电容</text>
</svg>
