<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">一轮问答交换双方 FIFO 数据</title>
  <desc id="desc">主机的发起帧携带本批序号、用户数据和对从机上一批的确认号，从机的应答帧携带本批序号、用户数据和对主机本轮的确认号。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
  <rect x="24" y="22" width="912" height="406" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="48" y="56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#111827">一轮问答交换双方 FIFO 数据</text>
  <text x="48" y="82" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#475569">主机发起帧带出本侧数据，从机应答帧带回对侧数据。</text>

  <rect x="68" y="104" width="264" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="200" y="128" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">主机</text>
  <text x="200" y="150" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#1e40af">发送 FIFO / 接收 FIFO</text>

  <rect x="628" y="104" width="264" height="58" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="760" y="128" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d">从机</text>
  <text x="760" y="150" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#166534">发送 FIFO / 接收 FIFO</text>

  <line x1="200" y1="162" x2="200" y2="336" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="760" y1="162" x2="760" y2="336" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>

  <line x1="214" y1="218" x2="746" y2="218" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="480" y="206" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700"><tspan fill="#2563eb">主机序号 </tspan><tspan>+ </tspan><tspan fill="#2563eb">用户数据 </tspan><tspan>+ </tspan><tspan fill="#15803d">确认号（从机上一轮序号）</tspan></text>
  <text x="744" y="244" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">从机接纳主机的数据</text>

  <line x1="746" y1="286" x2="214" y2="286" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="480" y="274" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700"><tspan fill="#15803d">从机序号 </tspan><tspan>+ </tspan><tspan fill="#15803d">用户数据 </tspan><tspan>+ </tspan><tspan fill="#2563eb">确认号（主机上一轮序号）</tspan></text>
  <text x="216" y="312" text-anchor="start" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">主机接纳从机的数据</text>

  <rect x="68" y="348" width="824" height="42" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="480" y="374" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#713f12">每次只发一小批：超时重发同一序号，确认后取下一批</text>
</svg>
