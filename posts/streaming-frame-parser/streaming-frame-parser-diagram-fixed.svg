<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="SimHei, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arwRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arwGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arwGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#ffffff"/>

  <!-- ===== 字节流 ===== -->
  <text x="40" y="34" font-size="14" fill="#0f172a">串口 / TCP 收到的字节流</text>
  <text x="40" y="52" font-size="11.5" fill="#64748b">（一次读取不等于一条消息）</text>

  <!-- 第 1 次读取 -->
  <rect x="40" y="66" width="36" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="58" y="87" font-size="12" text-anchor="middle" fill="#0f172a">帧头</text>
  <rect x="76" y="66" width="36" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="94" y="87" font-size="12" text-anchor="middle" fill="#0f172a">长度</text>
  <rect x="112" y="66" width="36" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="130" y="87" font-size="12" text-anchor="middle" fill="#0f172a">内容</text>
  <rect x="148" y="66" width="36" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="148" y="66" width="18" height="34" fill="#f1f5f9"/>
  <text x="166" y="87" font-size="12" text-anchor="middle" fill="#0f172a">内容</text>

  <line x1="222" y1="60" x2="222" y2="106" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 第 2 次读取 -->
  <rect x="254" y="66" width="36" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="272" y="66" width="18" height="34" fill="#f1f5f9"/>
  <text x="272" y="87" font-size="12" text-anchor="middle" fill="#0f172a">内容</text>
  <rect x="290" y="66" width="36" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="308" y="87" font-size="12" text-anchor="middle" fill="#0f172a">校验</text>
  <rect x="326" y="66" width="36" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="344" y="87" font-size="12" text-anchor="middle" fill="#0f172a">帧头</text>
  <rect x="362" y="66" width="36" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="380" y="87" font-size="12" text-anchor="middle" fill="#0f172a">长度</text>

  <!-- 读取括号 -->
  <path d="M40,106 L40,112 L184,112 L184,106" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="112" y="130" font-size="11.5" text-anchor="middle" fill="#334155">第 1 次读取：帧头+长度+半段内容</text>
  <path d="M254,106 L254,112 L398,112 L398,106" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="326" y="130" font-size="11.5" text-anchor="middle" fill="#334155">第 2 次读取：剩余内容+校验+下一帧</text>

  <!-- 图例 -->
  <rect x="640" y="58" width="14" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="662" y="69" font-size="11.5" fill="#334155">帧结构字节</text>
  <rect x="640" y="80" width="14" height="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="662" y="91" font-size="11.5" fill="#334155">内容字节</text>
  <rect x="640" y="102" width="7" height="14" fill="#f1f5f9"/>
  <rect x="647" y="102" width="7" height="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="662" y="113" font-size="11.5" fill="#334155">半填充：仅到一半的内容</text>

  <!-- ===== 输入箭头 ===== -->
  <line x1="110" y1="140" x2="110" y2="218" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="100" y="190" font-size="12" text-anchor="end" fill="#334155">逐字节喂状态机</text>

  <!-- ===== 失败反馈（顶部虚线） ===== -->
  <path d="M770,220 L770,168 L150,168 L150,218" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwRed)"/>
  <text x="560" y="148" font-size="11.5" text-anchor="middle" fill="#dc2626">校验失败 / 长度超限 / 等待超时：</text>
  <text x="560" y="163" font-size="11.5" text-anchor="middle" fill="#dc2626">只丢失败字节或放弃残帧，重新找帧头</text>

  <!-- ===== 状态机 ===== -->
  <rect x="40" y="222" width="140" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="110" y="246" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">① 等帧头</text>
  <text x="110" y="265" font-size="10.5" text-anchor="middle" fill="#475569">逐字节匹配</text>

  <rect x="260" y="222" width="140" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="330" y="246" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">② 等长度</text>
  <text x="330" y="265" font-size="10.5" text-anchor="middle" fill="#475569">读长度字段</text>

  <rect x="480" y="222" width="140" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="550" y="246" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">③ 收内容</text>
  <text x="550" y="265" font-size="10.5" text-anchor="middle" fill="#475569">按长度计数</text>

  <rect x="700" y="222" width="140" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="770" y="246" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">④ 校验</text>
  <text x="770" y="265" font-size="10.5" text-anchor="middle" fill="#475569">校验整帧</text>

  <!-- 状态间箭头 -->
  <line x1="182" y1="250" x2="254" y2="250" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="220" y="241" font-size="10.5" text-anchor="middle" fill="#334155">帧头命中</text>
  <line x1="402" y1="250" x2="474" y2="250" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="440" y="241" font-size="10.5" text-anchor="middle" fill="#334155">拿到长度</text>
  <line x1="622" y1="250" x2="694" y2="250" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="660" y="241" font-size="10.5" text-anchor="middle" fill="#334155">收满目标长度</text>

  <!-- 半包自环 -->
  <path d="M510,278 C510,308 590,308 590,278" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwGray)"/>
  <text x="550" y="324" font-size="11.5" text-anchor="middle" fill="#475569">未收满：保留状态，等待后续字节（半包）</text>

  <!-- ===== 输出 ===== -->
  <line x1="770" y1="278" x2="770" y2="346" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arwGreen)"/>
  <text x="780" y="316" font-size="11.5" fill="#15803d">校验通过</text>

  <rect x="580" y="350" width="260" height="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="710" y="374" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">完整消息帧</text>
  <text x="710" y="394" font-size="11" text-anchor="middle" fill="#475569">交付业务代码（不接触接收缓存）</text>

  <!-- 粘包反馈 -->
  <path d="M580,398 L110,398 L110,282" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwGray)"/>
  <text x="320" y="390" font-size="11.5" text-anchor="middle" fill="#475569">缓存中仍有剩余字节：继续寻找下一帧（粘包）</text>

  <!-- 图题 -->
  <text x="450" y="462" font-size="13" text-anchor="middle" fill="#334155" font-family="SimSun, serif">图 1　组帧状态机将连续字节流解析为完整消息帧</text>
</svg>
