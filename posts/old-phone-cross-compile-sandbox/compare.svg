<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f9fa"/>
  <text x="20" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">全量编译耗时对比（秒）</text>
  <text x="20" y="54" font-family="sans-serif" font-size="12" fill="#666">PY32 固件模板 · 70 个 C 文件 · CMake + GCC</text>

  <!-- 网格线 -->
  <line x1="60" y1="80" x2="60" y2="300" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="300" x2="600" y2="300" stroke="#999" stroke-width="1"/>
  <!-- 刻度 0/20/40 -->
  <text x="52" y="304" font-family="sans-serif" font-size="11" fill="#666" text-anchor="end">0</text>
  <text x="52" y="204" font-family="sans-serif" font-size="11" fill="#666" text-anchor="end">20</text>
  <text x="52" y="104" font-family="sans-serif" font-size="11" fill="#666" text-anchor="end">40</text>

  <!-- 柱1: 本机 6s -> y = 300 - 6/50*220 = 273.6 -->
  <rect x="110" y="274" width="100" height="26" fill="#4f7cff"/>
  <text x="160" y="264" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6 s</text>
  <text x="160" y="326" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">本机 Windows</text>
  <text x="160" y="343" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">GCC 14.3 · Ninja</text>

  <!-- 柱2: 手机 -j4 44s -> y = 300 - 44/50*220 = 106.4 -->
  <rect x="270" y="106" width="100" height="194" fill="#ff9f43"/>
  <text x="320" y="96" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">44 s</text>
  <text x="320" y="326" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">手机 -j4</text>
  <text x="320" y="343" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">proot + GCC 15.2</text>

  <!-- 柱3: 手机 -j8 40s -> y = 300 - 40/50*220 = 124 -->
  <rect x="430" y="124" width="100" height="176" fill="#ff9f43"/>
  <text x="480" y="114" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">40 s</text>
  <text x="480" y="326" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">手机 -j8</text>
  <text x="480" y="343" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">8 核全开</text>

  <!-- 标注 -->
  <text x="320" y="360" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">本机为热状态稳定值（首次 21 s，冷缓存）</text>
</svg>
