<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#f6f8fb"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">NH50BAT-4 维修判断链</text>
  <text x="60" y="91" font-family="Arial, sans-serif" font-size="16" fill="#566176">从电芯失效确认，到保护板诊断，再到整包购买决策</text>

  <rect x="60" y="145" width="190" height="125" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <text x="155" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9f1239">故障现象</text>
  <text x="155" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">0% / 充不进电</text>
  <text x="155" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">单节 0 V</text>

  <rect x="305" y="145" width="190" height="125" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="400" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">电芯验证</text>
  <text x="400" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">2.7 V / 200 mA</text>
  <text x="400" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">无充电电流</text>

  <rect x="550" y="145" width="190" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="645" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">保护板诊断</text>
  <text x="645" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">I²C 0x0B 在线</text>
  <text x="645" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">PF / Sealed</text>

  <rect x="795" y="145" width="190" height="125" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="890" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">解锁验证</text>
  <text x="890" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">只换一颗电芯</text>
  <text x="890" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">SEC 仍为 3</text>

  <rect x="1040" y="145" width="100" height="125" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="1090" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">决策</text>
  <text x="1090" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">比较</text>
  <text x="1090" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">整包价格</text>

  <path d="M250 207 H292" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M495 207 H537" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M740 207 H782" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M985 207 H1027" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M292 207 l-12 -8 v16 z" fill="#64748b"/>
  <path d="M537 207 l-12 -8 v16 z" fill="#64748b"/>
  <path d="M782 207 l-12 -8 v16 z" fill="#64748b"/>
  <path d="M1027 207 l-12 -8 v16 z" fill="#64748b"/>

  <text x="600" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">通信正常 ≠ 保护状态已解除 ≠ 值得继续维修</text>
</svg>
