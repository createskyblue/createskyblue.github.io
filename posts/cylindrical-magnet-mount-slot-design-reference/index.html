  <article class="article-body">
<h1>3D 打印圆柱磁铁安装槽设计参考</h1>
<ul>
<li><strong>磁铁规格</strong>：直径 10 mm × 高度 4 mm</li>
<li><strong>卡座内径</strong>：11 mm，略大于磁铁直径，便于装入</li>
<li><strong>壁厚</strong>：1 mm</li>
<li><strong>卡紧结构</strong>：内环在东、南、西、北四个方位各设一个直径 1.2 mm 的小圆柱；对向两柱之间的最小净距为 9.8 mm，略小于磁铁直径，用于卡住磁铁</li>
</ul>
