<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="780" height="320" fill="#ffffff"/>

  <!-- Box 1: subscribe -->
  <rect x="30" y="80" width="210" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="135" y="106" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">mbus_init(&amp;bus)</text>
  <text x="135" y="126" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">mbus_subscribe()</text>
  <text x="135" y="150" font-size="11" fill="#334155" text-anchor="middle">按话题登记回调</text>

  <!-- Box 2: publish -->
  <rect x="300" y="80" width="200" height="90" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="400" y="106" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">mbus_publish(topic,</text>
  <text x="400" y="126" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">payload)</text>
  <text x="400" y="150" font-size="11" fill="#334155" text-anchor="middle">匹配订阅表，拷贝 payload</text>

  <!-- Box 3: callbacks -->
  <rect x="560" y="80" width="190" height="90" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="655" y="106" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">on_sensor(event)</text>
  <text x="655" y="126" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">on_any(event)</text>
  <text x="655" y="150" font-size="11" fill="#334155" text-anchor="middle">只调用话题匹配的回调</text>

  <line x1="240" y1="125" x2="300" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="125" x2="560" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="135" y="200" font-size="11" fill="#475569" text-anchor="middle">1. 初始化 + 订阅</text>
  <text x="400" y="200" font-size="11" fill="#475569" text-anchor="middle">2. 发布事件</text>
  <text x="655" y="200" font-size="11" fill="#475569" text-anchor="middle">3. 匹配的回调被调用</text>

  <!-- queue path -->
  <rect x="300" y="235" width="200" height="58" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="400" y="257" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">mbus_queue() 入队</text>
  <text x="400" y="277" font-size="11" fill="#334155" text-anchor="middle">mbus_dispatch() 统一处理</text>
  <line x1="400" y1="170" x2="400" y2="235" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
