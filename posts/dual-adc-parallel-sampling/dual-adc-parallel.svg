<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <rect width="940" height="340" fill="#f8fafc"/>
  <text x="20" y="26" font-size="17" fill="#1e293b" font-weight="bold">采样结构：单 ADC 分时复用 vs 双 ADC 并行</text>

  <!-- ===== left: single ADC time-mux ===== -->
  <rect x="20" y="46" width="450" height="270" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="30" y="72" font-size="15" fill="#b91c1c" font-weight="bold">单 ADC 分时复用</text>

  <!-- ADC time bar: V + 24 C -->
  <rect x="30" y="100" width="16" height="44" fill="#dc2626"/>
  <text x="38" y="92" font-size="11" fill="#b91c1c" text-anchor="middle">V</text>
  <rect x="46" y="100" width="380" height="44" fill="#3b82f6"/>
  <text x="236" y="128" font-size="13" fill="#ffffff" text-anchor="middle">电流 C × 24</text>
  <text x="38" y="166" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">死区：电压占 1/25 时间，电流停采</text>

  <!-- current stream with hole -->
  <text x="30" y="204" font-size="13" fill="#475569">电流流每 25 个周期有一个缺口：</text>
  <rect x="30" y="214" width="48" height="26" fill="#3b82f6"/><rect x="82" y="214" width="48" height="26" fill="#3b82f6"/><rect x="134" y="214" width="48" height="26" fill="#3b82f6"/>
  <rect x="186" y="214" width="30" height="26" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="201" y="232" font-size="11" fill="#dc2626" text-anchor="middle">×</text>
  <rect x="220" y="214" width="48" height="26" fill="#3b82f6"/><rect x="272" y="214" width="48" height="26" fill="#3b82f6"/>
  <text x="350" y="234" font-size="13" fill="#475569">电流有效 24/25 ≈ 96%</text>

  <!-- ===== right: dual ADC parallel ===== -->
  <rect x="490" y="46" width="450" height="270" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="500" y="72" font-size="15" fill="#15803d" font-weight="bold">双 ADC 并行</text>

  <text x="500" y="102" font-size="13" fill="#1e293b">电压 ADC：</text>
  <rect x="580" y="88" width="16" height="30" fill="#16a34a"/>
  <text x="588" y="80" font-size="11" fill="#15803d" text-anchor="middle">V</text>

  <text x="500" y="162" font-size="13" fill="#1e293b">电流 ADC：</text>
  <rect x="580" y="148" width="340" height="30" fill="#3b82f6"/>
  <text x="750" y="168" font-size="12" fill="#ffffff" text-anchor="middle">电流 C × 24</text>

  <text x="580" y="210" font-size="13" fill="#16a34a" font-weight="bold">两路并行转换，互不占时间</text>
  <text x="500" y="238" font-size="13" fill="#475569">电流流连续无缺口，带宽不损失</text>
  <text x="500" y="262" font-size="13" fill="#475569">电压更新 1 次/帧（慢信号），电流 24 次/帧（快信号）</text>
  <text x="500" y="286" font-size="13" fill="#475569">各自采样率独立，不用分时</text>
</svg>
