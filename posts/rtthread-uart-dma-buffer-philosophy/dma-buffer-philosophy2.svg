<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="t d">
  <title id="t">RT-Thread 两代串口 DMA 缓冲设计对比</title>
  <desc id="d">左：V1 经典驱动，DMA 直接写环形缓冲，缓冲即应用 FIFO，写满覆盖旧数据；右：V2，DMA 写连续循环缓冲，HT / TC / 空闲（IDLE）中断触发软件把数据拷贝到独立应用 FIFO。蓝色表示 DMA 接收侧，橙色表示应用 FIFO，颜色只区分状态类别，不表示数据量。</desc>
  <defs>
    <marker id="m-gray"  markerWidth="6" markerHeight="6" refX="5" refY="2" orient="auto"><path d="M0,0 L0,4 L5,2 z" fill="#64748b"/></marker>
    <marker id="m-blue"  markerWidth="6" markerHeight="6" refX="5" refY="2" orient="auto"><path d="M0,0 L0,4 L5,2 z" fill="#2563eb"/></marker>
    <marker id="m-orange" markerWidth="6" markerHeight="6" refX="5" refY="2" orient="auto"><path d="M0,0 L0,4 L5,2 z" fill="#f97316"/></marker>
    <marker id="m-dark"  markerWidth="6" markerHeight="6" refX="5" refY="2" orient="auto"><path d="M0,0 L0,4 L5,2 z" fill="#273444"/></marker>
  </defs>

  <rect width="1240" height="680" fill="#f4f7fb"/>
  <rect x="24"  y="20" width="576" height="636" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
  <rect x="640" y="20" width="576" height="636" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>

  <!-- ============ V1 ============ -->
  <text x="56" y="60" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#152536">V1 经典驱动 · DMA 缓冲区即 FIFO</text>
  <text x="56" y="84" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5b6878">一块内存，写指针与读指针直接共享</text>

  <!-- UART -->
  <rect x="237" y="104" width="150" height="46" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="312" y="133" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">UART 输入字节流</text>

  <!-- DMA write arrow into ring top -->
  <line x1="312" y1="150" x2="312" y2="259" stroke="#2563eb" stroke-width="3.5"/>
  <text x="326" y="190" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1e3a8a">DMA 写入</text>
  <text x="326" y="208" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6878">W 指针沿环前进</text>

  <!-- ring (rotated -22.5deg, 4 unread sectors) -->
  <g transform="translate(0,-45) rotate(-22.5, 313, 400)">
  <path d="M314.5,304.0 A96,96 0 0 1 378.1,330.4 L353.3,356.5 A60,60 0 0 0 313.6,340.0 Z" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.2"/><path d="M381.6,333.9 A96,96 0 0 1 408.0,397.5 L372.0,398.4 A60,60 0 0 0 355.5,358.7 Z" fill="#e8edf3" stroke="#b8c4d1" stroke-width="1.2"/><path d="M408.0,402.5 A96,96 0 0 1 381.6,466.1 L355.5,441.3 A60,60 0 0 0 372.0,401.6 Z" fill="#e8edf3" stroke="#b8c4d1" stroke-width="1.2"/><path d="M378.1,469.6 A96,96 0 0 1 314.5,496.0 L313.6,460.0 A60,60 0 0 0 353.3,443.5 Z" fill="#e8edf3" stroke="#b8c4d1" stroke-width="1.2"/><path d="M309.5,496.0 A96,96 0 0 1 245.9,469.6 L270.7,443.5 A60,60 0 0 0 310.4,460.0 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="1.2"/><path d="M242.4,466.1 A96,96 0 0 1 216.0,402.5 L252.0,401.6 A60,60 0 0 0 268.5,441.3 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="1.2"/><path d="M216.0,397.5 A96,96 0 0 1 242.4,333.9 L268.5,358.7 A60,60 0 0 0 252.0,398.4 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="1.2"/><path d="M245.9,330.4 A96,96 0 0 1 309.5,304.0 L310.4,340.0 A60,60 0 0 0 270.7,356.5 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="1.2"/>  </g>

  <text x="312" y="349" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#273444">同一块内存</text>
  <text x="312" y="371" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6878">DMA 直写 · 应用直读</text>
  <text x="312" y="391" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c">零拷贝</text>

  <!-- overwrite warning -->
  <text x="430" y="285" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#273444">写满追上 R 指针</text>
  <text x="430" y="304" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#5b6878">旧数据被覆盖丢失</text>
  <path d="M 426,287 L 400,313" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- read pointer flowing to app -->
  <line x1="312" y1="451" x2="312" y2="549" stroke="#f97316" stroke-width="3"/>
  <rect x="230" y="552" width="164" height="42" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="312" y="579" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#c2410c">应用读取</text>

  <!-- legend -->
  <g font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">
    <rect x="56" y="506" width="14" height="14" rx="3" fill="#1d4ed8" stroke="#1e3a8a"/><text x="78" y="518" fill="#5b6878">刚写入（未读）</text>
    <rect x="56" y="528" width="14" height="14" rx="3" fill="#60a5fa" stroke="#2563eb"/><text x="78" y="540" fill="#5b6878">未读数据</text>
    <rect x="56" y="550" width="14" height="14" rx="3" fill="#e8edf3" stroke="#b8c4d1"/><text x="78" y="562" fill="#5b6878">已读，可被覆盖</text>
  </g>

  <line x1="56" y1="600" x2="568" y2="600" stroke="#d7dee8"/>
  <text x="56" y="624" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#c2410c" font-weight="600">✓ 内存最少 · 路径最短 · DMA 永不停止</text>
  <text x="56" y="646" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#5b6878" font-weight="600">✗ 溢出即丢旧数据，来不及读就没有了</text>

  <!-- ============ V2 ============ -->
  <text x="672" y="60" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#152536">V2 新驱动 · DMA 缓冲与 FIFO 分离</text>
  <text x="672" y="84" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5b6878">两块内存，HT / TC / 空闲中断触发软件搬运</text>

  <g transform="translate(8,0)">
  <!-- UART -->
  <rect x="845" y="104" width="150" height="46" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="920" y="133" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">UART 输入字节流</text>
  </g>
  <g transform="translate(8,45)">
  <!-- DMA write arrow (into ring top) -->
  <line x1="920" y1="105" x2="920" y2="174" stroke="#2563eb" stroke-width="3.5"/>
  <text x="935" y="139" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1e3a8a">DMA 写入</text>
  <!-- ring buffer: upper half = 前半区, lower half = 后半区 -->
  <path d="M 848,246 A 72,72 0 0 1 992,246 L 966,246 A 46,46 0 0 0 874,246 Z" fill="#2563eb"/>
  <path d="M 992,246 A 72,72 0 0 1 848,246 L 874,246 A 46,46 0 0 0 966,246 Z" fill="#dbeafe"/>
  <circle cx="920" cy="246" r="72" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
  <circle cx="920" cy="246" r="46" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="920" y="191" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#ffffff">前半区</text>
  <text x="920" y="309" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">后半区</text>
  <text x="920" y="244" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">两半轮换</text>
  <text x="920" y="262" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">DMA 循环写入</text>

  <!-- HT / TC markers on ring sides -->
  <text x="1007" y="230" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">HT</text>
  <text x="833" y="230" text-anchor="end" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">TC</text>

  <!-- copy arrows: direct horizontal lead-out then down -->
  <path d="M 992,246 L 1035,246 L 1035,342" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#m-blue)"/>
  <text x="1045" y="298" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1e3a8a">HT 触发</text>
  <text x="1045" y="314" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1e3a8a">软件拷贝前半区</text>
  <path d="M 848,246 L 805,246 L 805,342" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-blue)"/>
  <text x="795" y="298" text-anchor="end" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1e3a8a">TC 触发</text>
  <text x="795" y="314" text-anchor="end" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1e3a8a">下一轮拷后半区</text>

  <!-- IDLE trigger: line goes idle before half boundary, copy partial data now -->
  <path d="M 971,195 L 1038,128" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1046" y="132" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#1e3a8a">IDLE 触发</text>
  <text x="1046" y="150" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5b6878">线路空闲即拷贝不足半区</text>

  <!-- app FIFO -->
  <rect x="770" y="342" width="300" height="96" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="920" y="366" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="700" fill="#c2410c">应用 FIFO（独立缓冲区）</text>
  <g stroke="#f97316" stroke-width="1">
    <rect x="786" y="378" width="30" height="28" fill="#f97316"/>
    <rect x="820" y="378" width="30" height="28" fill="#f97316"/>
    <rect x="854" y="378" width="30" height="28" fill="#f97316"/>
    <rect x="888" y="378" width="30" height="28" fill="#f97316"/>
    <rect x="922" y="378" width="30" height="28" fill="#f97316"/>
    <rect x="956" y="378" width="30" height="28" fill="#f97316"/>
    <rect x="990" y="378" width="30" height="28" fill="#f97316"/>
    <rect x="1024" y="378" width="30" height="28" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 2"/>
  </g>
  <text x="920" y="428" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5b6878">橙色＝已入队数据 · 白色虚线＝空闲容量 · 满时策略可选</text>
  </g>

  <!-- app read -->
  <line x1="920" y1="483" x2="920" y2="548" stroke="#f97316" stroke-width="3"/>
  <text x="934" y="515" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#c2410c">应用读取</text>
  <rect x="845" y="552" width="150" height="42" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="920" y="579" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#c2410c">应用</text>

  <line x1="672" y1="600" x2="1184" y2="600" stroke="#d7dee8"/>
  <text x="672" y="624" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#c2410c" font-weight="600">✓ 边界清晰 · 溢出可控可恢复 · 接收不停</text>
  <text x="672" y="646" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#5b6878" font-weight="600">✗ 多一块内存 · 多一次数据搬运</text>

  <!-- VS divider -->
  <line x1="620" y1="40" x2="620" y2="640" stroke="#d7dee8" stroke-width="1.5"/>
  <circle cx="620" cy="338" r="22" fill="#ffffff" stroke="#b8c4d1" stroke-width="1.5"/>
  <text x="620" y="344" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="800" fill="#64748b">VS</text>
</svg>
