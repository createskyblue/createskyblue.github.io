<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">RT-Thread 两代串口 DMA 缓冲结构对比</title>
  <desc id="desc">左侧是 DMA 直接写入 RB 环形缓冲，右侧是一块连续循环 DMA 缓冲区通过 HT 和 TC 分成 PING、PONG 两个处理窗口，再把数据交给下方 FIFO。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#f8fafc"/>
  <rect x="24" y="24" width="500" height="510" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="576" y="24" width="500" height="510" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="48" y="62" font-family="sans-serif" font-size="23" font-weight="700" fill="#1e293b">V1：DMA 缓冲区就是 RB</text>
  <text x="600" y="62" font-family="sans-serif" font-size="23" font-weight="700" fill="#1e293b">V2：连续 DMA 缓冲间接形成 PING/PONG</text>

  <!-- V1 -->
  <rect x="52" y="112" width="118" height="62" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="111" y="139" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1e3a8a">UART</text>
  <text x="111" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">输入字节流</text>
  <line x1="170" y1="143" x2="214" y2="143" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="216" y="96" width="250" height="178" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="341" y="127" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#166534">RB / Ring Buffer</text>
  <text x="341" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">DMA 缓冲区 = 应用 FIFO</text>
  <g stroke="#16a34a" stroke-width="1">
    <rect x="238" y="178" width="25" height="36" fill="#86efac"/>
    <rect x="266" y="178" width="25" height="36" fill="#86efac"/>
    <rect x="294" y="178" width="25" height="36" fill="#bbf7d0"/>
    <rect x="322" y="178" width="25" height="36" fill="#bbf7d0"/>
    <rect x="350" y="178" width="25" height="36" fill="#bbf7d0"/>
    <rect x="378" y="178" width="25" height="36" fill="#bbf7d0"/>
    <rect x="406" y="178" width="25" height="36" fill="#bbf7d0"/>
    <rect x="434" y="178" width="15" height="36" fill="#fef9c3"/>
  </g>
  <path d="M443 232 C470 256, 456 282, 420 282 C382 282, 334 282, 286 282 C246 282, 223 258, 238 226" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="342" y="259" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8">W/R 指针循环移动</text>
  <text x="242" y="169" font-family="sans-serif" font-size="12" fill="#166534">写入</text>
  <text x="422" y="169" font-family="sans-serif" font-size="12" fill="#166534">读取</text>

  <line x1="341" y1="294" x2="341" y2="356" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="255" y="365" width="172" height="58" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="341" y="391" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">应用读取</text>
  <text x="341" y="411" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">零拷贝接收路径</text>
  <path d="M466 208 C495 238, 495 302, 441 337" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#red-arrow)"/>
  <text x="480" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b91c1c">满时覆盖旧数据</text>
  <text x="48" y="482" font-family="sans-serif" font-size="14" fill="#475569">优先级：少内存、短路径、DMA 持续运行</text>
  <text x="48" y="507" font-family="sans-serif" font-size="13" fill="#64748b">代价：溢出后接受旧数据损失</text>

  <!-- V2 -->
  <rect x="604" y="112" width="118" height="62" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="663" y="139" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1e3a8a">UART</text>
  <text x="663" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">输入字节流</text>
  <line x1="722" y1="143" x2="750" y2="143" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="752" y="96" width="256" height="150" rx="12" fill="#fef9c3" stroke="#facc15" stroke-width="2"/>
  <text x="880" y="123" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#854d0e">一块连续 DMA Circular Buffer</text>
  <rect x="774" y="145" width="106" height="62" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
  <rect x="880" y="145" width="106" height="62" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
  <line x1="880" y1="145" x2="880" y2="207" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="827" y="173" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">PING</text>
  <text x="827" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">前半区</text>
  <text x="933" y="173" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#166534">PONG</text>
  <text x="933" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">后半区</text>

  <line x1="827" y1="246" x2="827" y2="304" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="805" y="280" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">HT</text>
  <text x="805" y="298" text-anchor="end" font-family="sans-serif" font-size="12" fill="#475569">前半区完成</text>
  <line x1="933" y1="246" x2="933" y2="304" stroke="#16a34a" stroke-width="3" marker-end="url(#green-arrow)"/>
  <text x="955" y="280" font-family="sans-serif" font-size="14" font-weight="700" fill="#15803d">TC</text>
  <text x="955" y="298" font-family="sans-serif" font-size="12" fill="#475569">后半区完成</text>
  <text x="880" y="269" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">软件交替处理</text>

  <rect x="704" y="318" width="352" height="112" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="880" y="349" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">应用 FIFO / Ring Buffer</text>
  <g stroke="#16a34a" stroke-width="1">
    <rect x="736" y="369" width="32" height="32" fill="#86efac"/>
    <rect x="772" y="369" width="32" height="32" fill="#86efac"/>
    <rect x="808" y="369" width="32" height="32" fill="#bbf7d0"/>
    <rect x="844" y="369" width="32" height="32" fill="#bbf7d0"/>
    <rect x="880" y="369" width="32" height="32" fill="#bbf7d0"/>
    <rect x="916" y="369" width="32" height="32" fill="#bbf7d0"/>
    <rect x="952" y="369" width="32" height="32" fill="#bbf7d0"/>
  </g>
  <text x="880" y="421" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">DMA 接收与应用读取各自管理边界</text>
  <text x="600" y="482" font-family="sans-serif" font-size="14" fill="#475569">优先级：缓冲隔离、边界清晰、策略可选</text>
  <text x="600" y="507" font-family="sans-serif" font-size="13" fill="#64748b">代价：增加内存和一次数据搬运</text>
</svg>
