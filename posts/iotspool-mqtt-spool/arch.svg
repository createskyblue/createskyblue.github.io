<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;background:#f8fafc;border-radius:8px;">
  <!-- Producer side -->
  <rect x="20" y="40" width="140" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="66" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">传感器/业务</text>
  <text x="90" y="84" text-anchor="middle" fill="#475569" font-size="12">产生 MQTT 消息</text>

  <line x1="160" y1="70" x2="200" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="180" y="60" text-anchor="middle" fill="#64748b" font-size="11">enqueue</text>

  <!-- iotspool core -->
  <rect x="200" y="20" width="260" height="260" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="330" y="42" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">iotspool</text>

  <!-- RAM index (ring) -->
  <rect x="220" y="60" width="220" height="50" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="330" y="82" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">RAM 索引（环形 entries）</text>
  <text x="330" y="99" text-anchor="middle" fill="#475569" font-size="11">offset / len / qos / msg_id</text>

  <!-- Persistent log -->
  <rect x="220" y="125" width="220" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330" y="148" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">持久化 append-only 日志</text>
  <text x="330" y="166" text-anchor="middle" fill="#475569" font-size="11">ENQ 记录 / ACK 记录</text>
  <text x="330" y="182" text-anchor="middle" fill="#475569" font-size="11">CRC32 校验，掉电截断恢复</text>

  <!-- Backoff -->
  <rect x="220" y="210" width="220" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="330" y="232" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">退避调度器</text>
  <text x="330" y="249" text-anchor="middle" fill="#475569" font-size="11">Full Jitter 指数退避</text>

  <!-- MQTT client -->
  <line x1="460" y1="85" x2="500" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="480" y="75" text-anchor="middle" fill="#64748b" font-size="11">peek_ready</text>

  <rect x="500" y="55" width="180" height="60" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="590" y="81" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">MQTT 客户端</text>
  <text x="590" y="99" text-anchor="middle" fill="#475569" font-size="12">coreMQTT / Paho / mosquitto</text>

  <line x1="590" y1="115" x2="590" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="605" y="155" fill="#64748b" font-size="11">publish</text>

  <!-- Broker -->
  <rect x="500" y="190" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="590" y="216" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">MQTT Broker</text>
  <text x="590" y="234" text-anchor="middle" fill="#475569" font-size="12">云端 / 本地</text>

  <!-- ACK return -->
  <path d="M500,220 C460,220 460,170 460,170 L460,160" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="440" y="195" text-anchor="end" fill="#64748b" font-size="11">ack（QoS1 等 PUBACK）</text>

  <!-- Storage backend vtable -->
  <rect x="220" y="275" width="220" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="330" y="289" text-anchor="middle" fill="#64748b" font-size="11">store vtable：append / read_at / sync / truncate / replace</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
