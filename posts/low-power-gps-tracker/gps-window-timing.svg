<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">GPS 相邻定位比较漏掉跨周期位移示意图</title>
  <desc id="desc">设备每 60 分钟定位一次，上报阈值为 D。d(A,B) 和 d(B,C) 均小于 D，d(A,C) 大于或等于 D。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="360" rx="16" fill="#ffffff"/>
  <rect x="24" y="22" width="912" height="316" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="48" y="54" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#1e293b">相邻定位比较会漏掉跨周期位移</text>
  <text x="48" y="80" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#64748b">d(A,B) &lt; D，d(B,C) &lt; D，d(A,C) &gt;= D</text>

  <line x1="110" y1="124" x2="850" y2="124" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    <line x1="110" y1="116" x2="110" y2="132" stroke="#334155" stroke-width="2"/>
    <line x1="420" y1="116" x2="420" y2="132" stroke="#334155" stroke-width="2"/>
    <line x1="730" y1="116" x2="730" y2="132" stroke="#334155" stroke-width="2"/>
    <line x1="368" y1="118" x2="368" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="678" y1="118" x2="678" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

    <text x="110" y="108" text-anchor="middle">T0</text>
    <text x="420" y="108" text-anchor="middle">T0 + 60min</text>
    <text x="730" y="108" text-anchor="middle">T0 + 120min</text>
    <text x="368" y="151" text-anchor="middle" fill="#64748b">T0 + 50min</text>
    <text x="678" y="151" text-anchor="middle" fill="#64748b">T0 + 110min</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="110" cy="124" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="420" cy="124" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="730" cy="124" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">
    <text x="110" y="129" text-anchor="middle">A</text>
    <text x="420" y="129" text-anchor="middle">B</text>
    <text x="730" y="129" text-anchor="middle">C</text>
  </g>

  <text x="48" y="194" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#334155">相邻比较</text>
  <rect x="110" y="174" width="310" height="36" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <rect x="420" y="174" width="310" height="36" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="265" y="197" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#334155">d(A,B) &lt; D：未达到阈值</text>
  <text x="575" y="197" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#334155">d(B,C) &lt; D：未达到阈值</text>

  <text x="48" y="252" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#334155">移动过程</text>
  <rect x="368" y="230" width="310" height="40" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="523" y="255" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#166534">移动跨过 B 的采样时刻</text>

  <text x="48" y="312" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#334155">历史点比较</text>
  <rect x="110" y="290" width="620" height="38" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="420" y="314" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#713f12">d(A,C) &gt;= D：已达到阈值</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">
    <text x="772" y="195">只比较相邻点</text>
    <text x="772" y="218">本轮不会上报</text>
    <text x="772" y="310">同时回看 A 点</text>
    <text x="772" y="331">即可发现位移</text>
  </g>
</svg>
