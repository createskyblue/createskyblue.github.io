<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc">
  <title id="title">FIFO 回写乱序与消费者暂存区对比</title>
  <desc id="desc">错误路径：消费者取出 A、B 后 FIFO 剩 C、D（队头在右、队尾在左），生产者写入 E、F，再把 A、B 写回队尾（左端），顺序变成 C D E F A B。正确路径：A、B 进入右侧消费者暂存区，FIFO 独立接收 E、F，下一次消费发生才清空暂存区，A、B 始终不回写 FIFO。</desc>

  <defs>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1080" height="780" fill="#ffffff"/>
  <rect x="20" y="20" width="1040" height="740" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="48" y="56" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#0f172a">FIFO 批量取出后：写回 FIFO 与消费者暂存区对比</text>
  <text x="48" y="82" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">取出 A、B 后 FIFO 只剩 C、D。两种处理方式，后果完全不同。队头（开头）在右、队尾（结尾）在左。</text>

  <!-- ===== WRONG COLUMN ===== -->
  <rect x="40" y="108" width="500" height="560" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="64" y="142" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#991b1b">✗ 错误：把 A、B 写回 FIFO</text>

  <text x="64" y="182" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#334155">1 · 取出 A、B，FIFO 剩 C、D</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="312" y="196" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="335" y="225" fill="#334155">D</text>
    <rect x="374" y="196" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="397" y="225" fill="#334155">C</text>
  </g>
  <line x1="87" y1="250" x2="397" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <circle cx="87" cy="250" r="3.5" fill="#94a3b8"/>
  <text x="87" y="266" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">结尾</text>
  <text x="397" y="266" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">开头</text>

  <text x="64" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#334155">2 · 生产者写入 E、F</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="188" y="336" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="211" y="365" fill="#166534">F</text>
    <rect x="250" y="336" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="273" y="365" fill="#166534">E</text>
    <rect x="312" y="336" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="335" y="365" fill="#334155">D</text>
    <rect x="374" y="336" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="397" y="365" fill="#334155">C</text>
  </g>
  <line x1="87" y1="390" x2="397" y2="390" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <circle cx="87" cy="390" r="3.5" fill="#94a3b8"/>
  <text x="87" y="406" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">结尾</text>
  <text x="397" y="406" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">开头</text>

  <text x="64" y="470" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#991b1b">3 · 把 A、B 写回队尾（结尾 / 左端）</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="64" y="486" width="46" height="46" rx="6" fill="#fee2e2" stroke="#f87171"/><text x="87" y="515" fill="#991b1b">B</text>
    <rect x="126" y="486" width="46" height="46" rx="6" fill="#fee2e2" stroke="#f87171"/><text x="149" y="515" fill="#991b1b">A</text>
    <rect x="188" y="486" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="211" y="515" fill="#166534">F</text>
    <rect x="250" y="486" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="273" y="515" fill="#166534">E</text>
    <rect x="312" y="486" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="335" y="515" fill="#334155">D</text>
    <rect x="374" y="486" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="397" y="515" fill="#334155">C</text>
  </g>
  <line x1="40" y1="509" x2="60" y2="509" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="40" y="562" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#991b1b">写回 A、B</text>
  <line x1="87" y1="540" x2="397" y2="540" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <circle cx="87" cy="540" r="3.5" fill="#94a3b8"/>
  <text x="87" y="556" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">结尾</text>
  <text x="397" y="556" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">开头</text>

  <rect x="56" y="602" width="468" height="44" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="290" y="629" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#991b1b">✗ 顺序变成 C D E F A B，A、B 落到新数据之后</text>

  <!-- ===== CORRECT COLUMN ===== -->
  <rect x="560" y="108" width="500" height="560" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="584" y="142" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#166534">✓ 正确：消费者暂存区</text>

  <text x="584" y="182" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#334155">1 · 取出 A、B → 暂存区</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="708" y="196" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="731" y="225" fill="#334155">D</text>
    <rect x="770" y="196" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="793" y="225" fill="#334155">C</text>
  </g>
  <line x1="607" y1="250" x2="793" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <circle cx="607" cy="250" r="3.5" fill="#94a3b8"/>
  <text x="607" y="266" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">结尾</text>
  <text x="793" y="266" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">开头</text>
  <rect x="824" y="190" width="176" height="78" rx="9" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="836" y="212" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#166534">消费者暂存区</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="840" y="224" width="42" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="861" y="251" fill="#1e3a8a">B</text>
    <rect x="890" y="224" width="42" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="911" y="251" fill="#1e3a8a">A</text>
  </g>
  <path d="M 793 196 Q 821 172 849 196" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="821" y="166" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#166534">取出</text>

  <text x="584" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#334155">2 · 生产者写入 E、F（暂存区不动）</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="584" y="336" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="607" y="365" fill="#166534">F</text>
    <rect x="646" y="336" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="669" y="365" fill="#166534">E</text>
    <rect x="708" y="336" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="731" y="365" fill="#334155">D</text>
    <rect x="770" y="336" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="793" y="365" fill="#334155">C</text>
  </g>
  <line x1="607" y1="390" x2="793" y2="390" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <circle cx="607" cy="390" r="3.5" fill="#94a3b8"/>
  <text x="607" y="406" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">结尾</text>
  <text x="793" y="406" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">开头</text>
  <rect x="824" y="330" width="176" height="78" rx="9" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="836" y="352" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#166534">消费者暂存区</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="840" y="364" width="42" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="861" y="391" fill="#1e3a8a">B</text>
    <rect x="890" y="364" width="42" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="911" y="391" fill="#1e3a8a">A</text>
  </g>

  <text x="584" y="470" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#334155">3 · 下一次消费清空暂存区</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="584" y="486" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="607" y="515" fill="#166534">F</text>
    <rect x="646" y="486" width="46" height="46" rx="6" fill="#dcfce7" stroke="#4ade80"/><text x="669" y="515" fill="#166534">E</text>
    <rect x="708" y="486" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="731" y="515" fill="#334155">D</text>
    <rect x="770" y="486" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="793" y="515" fill="#334155">C</text>
  </g>
  <line x1="607" y1="540" x2="793" y2="540" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <circle cx="607" cy="540" r="3.5" fill="#94a3b8"/>
  <text x="607" y="556" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">结尾</text>
  <text x="793" y="556" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">开头</text>
  <rect x="824" y="480" width="176" height="84" rx="9" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="836" y="502" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#166534">消费者暂存区</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="840" y="516" width="42" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="861" y="543" fill="#1e3a8a">B</text>
    <rect x="890" y="516" width="42" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="911" y="543" fill="#1e3a8a">A</text>
  </g>
  <text x="584" y="582" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#166534">下一次消费发生 → 清空暂存区，FIFO 取下一批 C、D</text>

  <rect x="576" y="602" width="468" height="44" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="810" y="629" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#166534">✓ A、B 始终在暂存区，不回写 FIFO，顺序保持</text>

  <!-- ===== LEGEND ===== -->
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">
    <rect x="60" y="694" width="16" height="16" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="82" y="707">A、B：当前取出批次</text>
    <rect x="320" y="694" width="16" height="16" rx="3" fill="#e2e8f0" stroke="#94a3b8"/><text x="342" y="707">C、D：FIFO 原有</text>
    <rect x="560" y="694" width="16" height="16" rx="3" fill="#dcfce7" stroke="#4ade80"/><text x="582" y="707">E、F：生产者新写入</text>
    <rect x="800" y="694" width="16" height="16" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="822" y="707">A、B：写回后乱序</text>
  </g>
</svg>
