<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>

  <!-- ================= Left: microbus ================= -->
  <text x="30" y="30" font-size="18" font-weight="bold" fill="#0f172a">microbus：mbus_t 由调用者持有</text>

  <!-- caller column -->
  <g>
    <rect x="30" y="60" width="150" height="200" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="105" y="82" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">调用方</text>
    <rect x="45" y="96" width="120" height="30" rx="4" fill="#ffffff" stroke="#64748b"/>
    <text x="105" y="116" font-size="11" fill="#0f172a" text-anchor="middle">mbus_publish()</text>
    <rect x="45" y="136" width="120" height="30" rx="4" fill="#ffffff" stroke="#64748b"/>
    <text x="105" y="156" font-size="11" fill="#0f172a" text-anchor="middle">mbus_queue()</text>
    <rect x="45" y="176" width="120" height="30" rx="4" fill="#ffffff" stroke="#64748b"/>
    <text x="105" y="196" font-size="11" fill="#0f172a" text-anchor="middle">mbus_dispatch()</text>
    <text x="105" y="232" font-size="10" fill="#475569" text-anchor="middle">publish 立即分发</text>
    <text x="105" y="246" font-size="10" fill="#475569" text-anchor="middle">queue 延后分发</text>
  </g>

  <!-- mbus_t box -->
  <g>
    <rect x="210" y="60" width="190" height="240" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="305" y="82" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">mbus_t（栈/静态）</text>
    <rect x="225" y="94" width="160" height="86" rx="4" fill="#ffffff" stroke="#3b82f6"/>
    <text x="305" y="112" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">订阅表 subs[16]</text>
    <text x="305" y="130" font-size="10" fill="#334155" text-anchor="middle">topic + handler + ctx</text>
    <text x="305" y="146" font-size="10" fill="#334155" text-anchor="middle">MBUS_TOPIC_ANY 通配</text>
    <text x="305" y="162" font-size="10" fill="#334155" text-anchor="middle">192 B</text>
    <rect x="225" y="192" width="160" height="92" rx="4" fill="#ffffff" stroke="#3b82f6"/>
    <text x="305" y="210" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">环形队列 queue[8]</text>
    <text x="305" y="228" font-size="10" fill="#334155" text-anchor="middle">事件拷贝 40 B/条</text>
    <text x="305" y="244" font-size="10" fill="#334155" text-anchor="middle">dispatch 快照限次</text>
    <text x="305" y="260" font-size="10" fill="#334155" text-anchor="middle">320 B</text>
  </g>

  <!-- subscribers -->
  <g>
    <rect x="430" y="90" width="150" height="120" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="505" y="112" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">订阅者回调</text>
    <text x="505" y="132" font-size="10" fill="#334155" text-anchor="middle">on_sensor(topic=0x10)</text>
    <text x="505" y="148" font-size="10" fill="#334155" text-anchor="middle">on_any(topic=ANY)</text>
    <text x="505" y="168" font-size="10" fill="#334155" text-anchor="middle">按话题过滤，</text>
    <text x="505" y="184" font-size="10" fill="#334155" text-anchor="middle">升序确定分发</text>
  </g>

  <line x1="180" y1="120" x2="210" y2="120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="160" x2="210" y2="200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="400" y1="140" x2="430" y2="140" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="230" x2="430" y2="180" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- divider -->
  <line x1="610" y1="20" x2="610" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ================= Right: lwevt ================= -->
  <text x="640" y="30" font-size="18" font-weight="bold" fill="#0f172a">lwevt：全局静态单例</text>

  <g>
    <rect x="640" y="60" width="210" height="170" rx="8" fill="#fff7ed" stroke="#f97316"/>
    <text x="745" y="82" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">全局静态区</text>
    <rect x="655" y="94" width="180" height="52" rx="4" fill="#ffffff" stroke="#f97316"/>
    <text x="745" y="112" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">evt 默认句柄（12 B）</text>
    <text x="745" y="130" font-size="10" fill="#334155" text-anchor="middle">type + 数据 union</text>
    <rect x="655" y="158" width="180" height="60" rx="4" fill="#ffffff" stroke="#f97316"/>
    <text x="745" y="176" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">监听表 evt_fncs[8]</text>
    <text x="745" y="194" font-size="10" fill="#334155" text-anchor="middle">函数指针数组 32 B</text>
    <text x="745" y="210" font-size="10" fill="#334155" text-anchor="middle">注册去重，无退订</text>
  </g>

  <g>
    <rect x="640" y="260" width="210" height="80" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="745" y="282" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">lwevt_dispatch(type)</text>
    <text x="745" y="300" font-size="10" fill="#334155" text-anchor="middle">广播给全部监听器</text>
    <text x="745" y="316" font-size="10" fill="#334155" text-anchor="middle">监听器内按 type 过滤</text>
  </g>

  <line x1="745" y1="230" x2="745" y2="260" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="655" y="360" width="80" height="40" rx="4" fill="#ffffff" stroke="#f97316"/>
    <text x="695" y="384" font-size="11" fill="#0f172a" text-anchor="middle">listener A</text>
    <rect x="745" y="360" width="80" height="40" rx="4" fill="#ffffff" stroke="#f97316"/>
    <text x="785" y="384" font-size="11" fill="#0f172a" text-anchor="middle">listener B</text>
    <line x1="695" y1="340" x2="695" y2="360" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="785" y1="340" x2="785" y2="360" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="855" y="390" font-size="10" fill="#475569" text-anchor="middle">零拷贝，</text>
    <text x="855" y="404" font-size="10" fill="#475569" text-anchor="middle">直接读写句柄</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
