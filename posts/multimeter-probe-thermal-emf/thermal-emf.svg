<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280">
  <rect width="680" height="280" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#1e293b">表笔短接回路里的热电势</text>

  <!-- left probe metal -->
  <rect x="80" y="110" width="160" height="28" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="1"/>
  <text x="160" y="95" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">红笔尖金属 A</text>

  <!-- right probe metal -->
  <rect x="440" y="110" width="160" height="28" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="520" y="95" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">黑笔尖金属 B</text>

  <!-- short junction -->
  <rect x="240" y="118" width="200" height="12" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <text x="340" y="152" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">短接点</text>

  <!-- heat marks -->
  <path d="M120 70 q8 -14 16 0 q8 -14 16 0" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="136" y="58" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c2410c">手温 / 打火机</text>
  <text x="136" y="168" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c2410c">热端 T1</text>

  <text x="520" y="168" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">冷端 T2</text>

  <!-- meter -->
  <rect x="250" y="190" width="180" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="340" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">DM3058E 电流档</text>
  <text x="340" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#b91c1c">µA 级读数</text>

  <!-- wires -->
  <path d="M160 138 V218 H250" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M520 138 V218 H430" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- caption -->
  <text x="340" y="268" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">两种金属接成回路，两端温差 ΔT 产生热电势，短接后表现为电流读数</text>
</svg>
