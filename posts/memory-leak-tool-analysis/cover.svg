  <circle cx="1020" cy="462" r="20" fill="#fb923c" opacity="0.3" filter="url(#halo)"/>
  <circle cx="1020" cy="462" r="11" fill="#fb923c"/>
  <circle cx="1020" cy="462" r="4" fill="#fff7ed"/>
