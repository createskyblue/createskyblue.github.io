  <text x="90" y="250" font-size="160" font-weight="bold" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">内存泄漏</text>
  <text x="90" y="470" font-size="160" font-weight="bold" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif">分析</text>

  <polyline fill="none" stroke="url(#line)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#halo)"
