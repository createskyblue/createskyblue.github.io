<rect x="570" y="112" width="40" height="22" rx="4" fill="none" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 3"/>
<text x="100" y="150" font-size="11" fill="#DC2626">这四个时刻到达的事件全部积压，蓝牙链路超时即断连</text>
<text x="24" y="176" font-size="12" font-weight="600" fill="#1F2328">拆成五步</text>
