<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="680" height="200" fill="#FFFFFF"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1F2328">一次刷屏为什么不能一次做完</text><text x="24" y="50" font-size="12" fill="#656D76">TMOS 协作式单线程：任务占住主循环期间，蓝牙与按键没人应答</text>
<text x="24" y="86" font-size="12" font-weight="600" fill="#1F2328">整块刷完</text>
