<svg xmlns="http://www.w3.org/2000/svg" width="680" height="206" viewBox="0 0 680 206" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="680" height="206" fill="#FFFFFF"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1F2328">刷新间隔随数据变老而拉长</text><text x="24" y="50" font-size="12" fill="#656D76">屏幕刷得越少电池活得越久，而人眼看不出 15 分钟和 1 分钟的差别</text>
<rect x="46" y="142" width="88" height="26" rx="4" fill="#1E40AF"/>
<text x="90" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">1 分钟</text>
<text x="90" y="184" text-anchor="middle" font-size="11" fill="#656D76">0–15 分钟</text>
<rect x="164" y="118" width="88" height="50" rx="4" fill="#1E40AF"/>
<text x="208" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">5 分钟</text>
<text x="208" y="184" text-anchor="middle" font-size="11" fill="#656D76">15 分钟–1 天</text>
<rect x="282" y="92" width="88" height="76" rx="4" fill="#1E40AF"/>
<text x="326" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">15 分钟</text>
<text x="326" y="184" text-anchor="middle" font-size="11" fill="#656D76">1–7 天</text>
<rect x="400" y="64" width="88" height="104" rx="4" fill="#1E40AF"/>
<text x="444" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">1 小时</text>
<text x="444" y="184" text-anchor="middle" font-size="11" fill="#656D76">7 天以上</text>
<text x="444" y="198" text-anchor="middle" font-size="11" fill="#656D76">看 7 天窗</text>
<rect x="518" y="36" width="88" height="132" rx="4" fill="#1E40AF"/>
<text x="562" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">6 小时</text>
<text x="562" y="184" text-anchor="middle" font-size="11" fill="#656D76">7 天以上</text>
<text x="562" y="198" text-anchor="middle" font-size="11" fill="#656D76">看 30 天窗</text>
<line x1="46" y1="168" x2="636" y2="168" stroke="#D0D7DE" stroke-width="1"/>
<text x="24" y="196" font-size="11" fill="#656D76">横轴是数据年龄，纵轴是多久刷一次屏幕</text></svg>