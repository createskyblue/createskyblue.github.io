<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <rect width="940" height="340" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" fill="#1e293b" font-weight="bold">双阈值滞回：升档线与降档线分开，中间是死区</text>

  <!-- measurement axis -->
  <line x1="80" y1="170" x2="860" y2="170" stroke="#1e293b" stroke-width="3" marker-end="url(#axarr)"/>
  <text x="80" y="198" font-size="13" fill="#475569">0（见底）</text>
  <text x="860" y="198" font-size="13" fill="#475569" text-anchor="end">满量程</text>

  <!-- switch-down line (low threshold) -->
  <line x1="158" y1="100" x2="158" y2="245" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="158" y="90" font-size="14" fill="#b45309" text-anchor="start" font-weight="bold">降档线 10%：读数跌破 → 降档</text>
  <text x="158" y="146" font-size="16" fill="#b45309" text-anchor="middle" font-weight="bold">↓</text>

  <!-- switch-up line (high threshold) -->
  <line x1="821" y1="100" x2="821" y2="245" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="821" y="90" font-size="14" fill="#b91c1c" text-anchor="end" font-weight="bold">升档线 95%：读数超过 → 升档</text>
  <text x="821" y="146" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">↑</text>

  <!-- dead zone -->
  <rect x="158" y="152" width="663" height="36" rx="4" fill="#e2e8f0" opacity="0.9"/>
  <text x="490" y="176" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">滞回死区：读数落在此区间，任何档位都不切换</text>

  <!-- decade note -->
  <text x="20" y="285" font-size="14" fill="#1e293b" font-weight="bold">量程每级 ×10，放大滞回：</text>
  <text x="20" y="310" font-size="13" fill="#475569">升档前读数在旧档 95%；升档后同一物理读数只占新档约 9.5%，要触发降档得再跌到新档 10% 以下（旧档 1%）——跨度近 95 倍，横跳在物理上不可能发生。</text>

  <defs>
    <marker id="axarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1e293b"/></marker>
  </defs>
</svg>
