<svg viewBox="0 0 680 364" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>一机一密的密钥派生与三个用途</title>
<desc>芯片 UID、Flash ID 和盐三者经 hash 运算得到每台设备唯一的密钥，这把密钥用于加密专属资源、绑定激活凭证、保护外部数据。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="40" y="40" fill="#2C2C2A" dominant-baseline="central">三个输入算出一把 key，三个用途共用它</text>

<rect x="40" y="64" width="170" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="125" y="84" text-anchor="middle" fill="#0C447C" dominant-baseline="central">芯片 UID</text>
<text class="ts" x="125" y="104" text-anchor="middle" fill="#185FA5" dominant-baseline="central">出厂烧死，改不掉</text>

<rect x="235" y="64" width="170" height="52" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text class="th" x="320" y="84" text-anchor="middle" fill="#185FA5" dominant-baseline="central">Flash ID</text>
<text class="ts" x="320" y="104" text-anchor="middle" fill="#378ADD" dominant-baseline="central">只作辅助</text>

<rect x="430" y="64" width="170" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="th" x="515" y="84" text-anchor="middle" fill="#791F1F" dominant-baseline="central">盐</text>
<text class="ts" x="515" y="104" text-anchor="middle" fill="#A32D2D" dominant-baseline="central">存在读保护芯片内</text>

<path d="M125 116 L125 130 L340 130 L340 142" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 116 L320 142" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M515 116 L515 130 L340 130 L340 142" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="240" y="146" width="200" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="340" y="166" text-anchor="middle" fill="#444441" dominant-baseline="central">hash 运算</text>

<path d="M340 186 L340 212" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="216" width="300" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="238" text-anchor="middle" fill="#3C3489" dominant-baseline="central">每台设备唯一的 key</text>

<path d="M340 260 L340 274 L125 274 L125 288" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 260 L340 288" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 260 L340 274 L515 274 L515 288" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="292" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="125" y="312" text-anchor="middle" fill="#085041" dominant-baseline="central">加密专属资源</text>
<text class="ts" x="125" y="332" text-anchor="middle" fill="#0F6E56" dominant-baseline="central">抄到别板解不开</text>

<rect x="235" y="292" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="320" y="312" text-anchor="middle" fill="#085041" dominant-baseline="central">绑定激活凭证</text>
<text class="ts" x="320" y="332" text-anchor="middle" fill="#0F6E56" dominant-baseline="central">换台机器就失效</text>

<rect x="430" y="292" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="515" y="312" text-anchor="middle" fill="#085041" dominant-baseline="central">保护外部数据</text>
<text class="ts" x="515" y="332" text-anchor="middle" fill="#0F6E56" dominant-baseline="central">片外只存密文</text>
</svg>
