<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#1a1a1a">连接事件 status 的来源与污染路径</text>

  <!-- 左列：正常路径 -->
  <rect x="40" y="60" width="300" height="52" rx="6" fill="#eef4ff" stroke="#4a7fd4"/>
  <text x="190" y="82" text-anchor="middle" font-size="13" fill="#1a1a1a">手机连接配网 BLE</text>
  <text x="190" y="100" text-anchor="middle" font-size="11" fill="#444">LE Connection Complete（链路已建立）</text>

  <rect x="40" y="140" width="300" height="52" rx="6" fill="#f3f6fb" stroke="#8a9bb5"/>
  <text x="190" y="162" text-anchor="middle" font-size="13" fill="#1a1a1a">NimBLE 发 Read Remote Version HCI</text>
  <text x="190" y="180" text-anchor="middle" font-size="11" fill="#444">读对端版本号（外设侧必经事务）</text>

  <!-- 两条分支 -->
  <rect x="40" y="250" width="300" height="52" rx="6" fill="#e8f7ec" stroke="#3fa060"/>
  <text x="190" y="272" text-anchor="middle" font-size="13" fill="#1a1a1a">HCI 成功（status=0）</text>
  <text x="190" y="290" text-anchor="middle" font-size="11" fill="#444">WiFi 空闲 / 未重连</text>

  <rect x="420" y="250" width="300" height="52" rx="6" fill="#fdeeee" stroke="#d05a5a"/>
  <text x="570" y="272" text-anchor="middle" font-size="13" fill="#1a1a1a">HCI 返回 0x1A（26）</text>
  <text x="570" y="290" text-anchor="middle" font-size="11" fill="#444">STA 反复重连，Wi-Fi/BT 共存争抢</text>

  <rect x="40" y="350" width="300" height="52" rx="6" fill="#e8f7ec" stroke="#3fa060"/>
  <text x="190" y="372" text-anchor="middle" font-size="13" fill="#1a1a1a">连接事件 status=0</text>
  <text x="190" y="390" text-anchor="middle" font-size="11" fill="#444">esp_blufi is_connected=true</text>

  <rect x="420" y="350" width="300" height="52" rx="6" fill="#fdeeee" stroke="#d05a5a"/>
  <text x="570" y="372" text-anchor="middle" font-size="13" fill="#1a1a1a">连接事件 status=26（ble_gap.c:3619）</text>
  <text x="570" y="390" text-anchor="middle" font-size="11" fill="#444">esp_blufi is_connected=false</text>

  <rect x="40" y="450" width="300" height="52" rx="6" fill="#e8f7ec" stroke="#3fa060"/>
  <text x="190" y="472" text-anchor="middle" font-size="13" fill="#1a1a1a">发送正常（WiFi 列表可达）</text>
  <text x="190" y="490" text-anchor="middle" font-size="11" fill="#444">配网 App 正常显示</text>

  <rect x="420" y="450" width="300" height="52" rx="6" fill="#fdeeee" stroke="#d05a5a"/>
  <text x="570" y="472" text-anchor="middle" font-size="13" fill="#1a1a1a">btc_blufi_send_encap 静默丢弃</text>
  <text x="570" y="490" text-anchor="middle" font-size="11" fill="#444">配网 App 按了没反应</text>

  <!-- 箭头 -->
  <line x1="190" y1="112" x2="190" y2="138" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="192" x2="190" y2="248" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="302" x2="190" y2="348" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="402" x2="190" y2="448" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="266" x2="418" y2="266" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="302" x2="570" y2="348" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="402" x2="570" y2="448" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a9bb5"/>
    </marker>
  </defs>
</svg>
