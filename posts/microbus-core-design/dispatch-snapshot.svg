<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>

  <!-- queue ring, stage 1 -->
  <rect x="30" y="30" width="350" height="100" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="205" y="52" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">① 入口：eligible = 队列计数 = 2</text>
  <text x="205" y="72" font-size="11" fill="#334155" text-anchor="middle">队列槽： 0   1   2   3   4   5   6   7</text>
  <text x="205" y="94" font-size="11" fill="#0f172a" text-anchor="middle">tail ↓  [E1] [E2] [  ] [  ] [  ] [  ] [  ] [  ]  ↑ head</text>
  <text x="205" y="116" font-size="10" fill="#475569" text-anchor="middle">E1、E2 是本回合要处理的</text>

  <!-- stage 2 -->
  <rect x="30" y="150" width="350" height="100" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="205" y="172" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">② 处理 E1 时回调再入队 E3</text>
  <text x="205" y="192" font-size="11" fill="#334155" text-anchor="middle">队列槽： 0   1   2   3   4   5   6   7</text>
  <text x="205" y="214" font-size="11" fill="#0f172a" text-anchor="middle">tail ↓  [E2] [  ] [  ] [  ] [  ] [  ] [  ] [E3]  ↑ head</text>
  <text x="205" y="236" font-size="10" fill="#475569" text-anchor="middle">eligible 减为 1，E3 留在队列尾部</text>

  <!-- stage 3 -->
  <rect x="30" y="270" width="350" height="100" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="205" y="292" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">③ 退出：eligible = 0</text>
  <text x="205" y="312" font-size="11" fill="#334155" text-anchor="middle">队列槽： 0   1   2   3   4   5   6   7</text>
  <text x="205" y="334" font-size="11" fill="#0f172a" text-anchor="middle">tail ↓  [  ] [  ] [  ] [  ] [  ] [  ] [  ] [E3]  ↑ head</text>
  <text x="205" y="356" font-size="10" fill="#475569" text-anchor="middle">E3 留到下次 mbus_dispatch</text>

  <!-- dispatch loop -->
  <rect x="430" y="60" width="340" height="280" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="600" y="86" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">mbus_dispatch 循环</text>
  <text x="445" y="112" font-size="12" fill="#0f172a">eligible = 队列计数   /* 快照 */</text>
  <text x="445" y="136" font-size="12" fill="#0f172a">while (eligible &gt; 0) {</text>
  <text x="460" y="158" font-size="12" fill="#0f172a">  pop 到局部事件;</text>
  <text x="460" y="180" font-size="12" fill="#0f172a">  分发回调;      /* 可再入队 */</text>
  <text x="460" y="202" font-size="12" fill="#0f172a">  eligible--;</text>
  <text x="445" y="224" font-size="12" fill="#0f172a">}</text>
  <text x="445" y="252" font-size="12" fill="#334155">回调里 mbus_queue 的事件</text>
  <text x="445" y="274" font-size="12" fill="#334155">只增长 head，不影响 eligible，</text>
  <text x="445" y="296" font-size="12" fill="#334155">本回合最多处理 eligible 个</text>
  <text x="445" y="322" font-size="12" font-weight="bold" fill="#0f172a">→ 单次 dispatch 执行时间有界</text>

  <line x1="380" y1="150" x2="430" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
